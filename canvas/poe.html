<!DOCTYPE html>
<html>
<head>
    <title>POE for Canvas</title>
    <script src="https://datat.vercel.app/basicsmin.js"></script>
    <script src="https://datat.vercel.app/screenmin.js"></script>

<style>

    :root {
        --bg: #f4f4f6;
        --panel: #ffffff;
        --panel-border: #d8d8de;
        --text: #1c1c22;
        --muted: #6b6b76;
        --accent: #4f6df5;
        --accent-text: #ffffff;
        --win-header: #eceef4;
        --win-bg: #ffffff;
        --win-border: #c9cbd6;
        --shadow: rgba(0, 0, 0, .15);
        --grid-dot: #c7c7d1;
    }

    ::-webkit-scrollbar {
        width: 11px;
        background-color: var(--win-border);
    }

    ::-webkit-scrollbar-thumb {
            width: 5px;
            background-color: var(--muted);
            border-left: 2px solid var(--win-border);
            border-right: 3px solid var(--win-border);
    }

    ::-webkit-scrollbar-thumb:hover {
        width: 5px;
        background-color: var(--text);
    }

    * {
        border: 0;
        padding: 0;
        margin: 0;
        outline: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #campoentrada {

        font-size: 18px;
        line-height: 22px;
        padding-top: 23px;
        padding-bottom: 23px;
        /* height: 40px;
        width: calc(100% - 40px); */
        color: var(--bg);
        background-color: var(--text);
        padding-left: 20px;
        padding-right: 20px;

    }

    #campoentrada input {
        width: calc(100% - 40px);
        font-size: 30px;
        line-height: 40px;
        color: var(--bg);
        background-color: var(--text);
        outline: none !important;
        font-family: monospace;

    }

    #resultados {
        width: 100%;
        height: calc(100dvh - 86px);
        overflow-x: hidden;
        overflow-y: auto;
    }
                

    .menu_menuopt {
    
    display: flex;
    flex-direction: column;
    align-items: start;
    height: 100%;
    background-color: var(--panel-border);
    
    }

    .menu_menuopt div {

    cursor: pointer;
    font-size: 18px;
    line-height: 22px;
    padding-top: 23px;
    padding-bottom: 23px;
    height: auto;
    width: calc(100% - 40px);
    color: var(--text);
    background-color: var(--panel-border);
    padding-left: 20px;
    padding-right: 20px;
    border-top: 1px dotted var(--muted);
    }

    .menu_menuopt div:last-child {
        border-bottom: 1px dotted var(--muted);
    }

    .menu_menuopt div:hover {
    background-color: var(--win-header);
    }

    .menu_menuopt div.secao {
    cursor: default;
    background-color: var(--accent);
    color: var(--bg);
    text-transform: uppercase;
    font-family: monospace;
    font-size: 13px;
    font-weight: lighter;
    }

    .menu_menuopt div.secao:hover {
    background-color: var(--accent);
    cursor: default;
    }


</style>

</head>
<body>
            <div id="campoentrada"><input type="text" id="entra" /></div>
            <div id="resultados">
                <div class="menu_menuopt" id="poe">
                    <div class="secao">CARREGANDO</div>
                </div>
            </div>



            <script>

                $_GET = [];
                (function(){
                    corte = window.location.href.toString().indexOf('?');
                    if (corte > 0) {
                        argumento = window.location.href.toString().substring(corte + 1);
                        argumentos = argumento.split('&');
                        for (arg in argumentos){
                            let argCorte = argumentos[arg].indexOf('=');
                            $_GET[argumentos[arg].substring(0,argCorte)] = argumentos[arg].substring(argCorte + 1);
                        }
                    } 
                })();

                

                if(typeof $_GET["text"] != undefined && $_GET["text"] != null && $_GET["text"] != "") {
                    cssVar("--text").value = "#" + $_GET["text"];
                }

                if(typeof $_GET["accent"] != undefined && $_GET["accent"] != null && $_GET["accent"] != "") {
                    cssVar("--accent").value = "#" + $_GET["accent"];
                }

                if(typeof $_GET["muted"] != undefined && $_GET["muted"] != null && $_GET["muted"] != "") {
                    cssVar("--muted").value = "#" + $_GET["muted"];
                }

                if(typeof $_GET["bg"] != undefined && $_GET["bg"] != null && $_GET["bg"] != "") {
                    cssVar("--bg").value = "#" + $_GET["bg"];
                }

                if(typeof $_GET["panel-border"] != undefined && $_GET["panel-border"] != null && $_GET["panel-border"] != "") {
                    cssVar("--panel-border").value = "#" + $_GET["panel-border"];
                }

                if(typeof $_GET["win-header"] != undefined && $_GET["win-header"] != null && $_GET["win-header"] != "") {
                    cssVar("--win-header").value = "#" + $_GET["win-header"];
                }

                janela = function(url) {
                    window.open(url, "_blank");
                    parent.postMessage(`remove('POE')`, "*");
                }

                vai = function(u, n) {
                    parent.postMessage(`newidoc("${u}", "${n}")`, "*");
                    parent.postMessage(`centerlastframe()`, "*");
                    parent.postMessage(`remove('POE')`, "*");
                }

                roda = function(u) {
                    parent.postMessage(`${u}`, "*");
                    parent.postMessage(`centerlastframe()`, "*");
                    parent.postMessage(`remove('POE')`, "*");
                }

                let filtra = "";

                if (typeof $_GET["filtra"] != 'undefined' && $_GET["filtra"] != null && $_GET["filtra"] != '') {
                   filtra = decodeURI($_GET["filtra"]);
                }
                

                startrun = true;

                omnifilter = function (oarr) {

                    console.log("> - " + filtra);
                    
                    let arr = selecte(oarr, filtra);

                    console.table(arr);

                    let grupos = tags(arr, "Group", ",");

                    let code = "";

                    for (let g=0; g<grupos.length; g++) {

                        code += `<div class="secao">${grupos[g]}</div>`;

                        for (let i=0; i<arr.length; i++) {
                            if (arr[i].Group.match(grupos[g])) {

                                if (arr[i].Type == "self") {
                                    code += `<div onclick="roda('${arr[i].Link}');">${arr[i].Name}</div>`;
                                }

                                if (arr[i].Type == "embed") {
                                    code += `<div onclick="vai('${arr[i].Link}', '${arr[i].Name}');">${arr[i].Name}</div>`;
                                } 
                                if (arr[i].Type != "self" && arr[i].Type != "embed") {
                                    code += `<div onclick="janela('${arr[i].Link}');">${arr[i].Name}</div>`;
                                }
                            }



                        }




                    }

                    document.getElementById("poe").innerHTML = code;

                    if (typeof $_GET["start"] != 'undefined' && $_GET["start"] != null && $_GET["start"] != '') {
                       
                        if (startrun) {
                            startrun = false;
                            document.getElementById("entra").value = decodeURI($_GET["start"]) + " ";
                            document.getElementById("entra").dispatchEvent(new Event('input', { bubbles: true }));
                        };
                    }
                }
                                
                omnifilterfetchcsvdata(GoogleSheetCsvURL($_GET["source"]), "entra");

                document.getElementById("entra").focus();

                document.addEventListener('keydown', function (e) {

                            if (event.ctrlKey && event.key === '/') {
                                // Evita comportamentos padrão do navegador, se houver
                                e.cancelBubble = true;
                                        e.cancelable = true;
                                        e.stopPropagation();
                                        e.preventDefault();
                                        e.returnValue = false;
                            
                                roda(`togglepoe()`);

                            }

                
                
                });

            </script>
</body>

</html>
