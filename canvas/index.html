<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canvas Infinito</title>
<script>
$_GET = [];
      (function () {
        corte = window.location.href.toString().indexOf("?");
        if (corte > 0) {
          argumento = window.location.href.toString().substring(corte + 1);
          argumentos = argumento.split("&");
          for (arg in argumentos) {
            let argCorte = argumentos[arg].indexOf("=");
            $_GET[argumentos[arg].substring(0, argCorte)] = argumentos[
              arg
            ].substring(argCorte + 1);
          }
        }
      })();
</script>
<style>
  :root{
    --bg:#f4f4f6; --panel:#ffffff; --panel-border:#d8d8de; --text:#1c1c22;
    --muted:#6b6b76; --accent:#4f6df5; --accent-text:#ffffff;
    --win-header:#eceef4; --win-bg:#ffffff; --win-border:#c9cbd6;
    --shadow:rgba(0,0,0,.15); --grid-dot:#c7c7d1;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16171d; --panel:#202129; --panel-border:#33343e; --text:#eceef2;
      --muted:#9a9aa6; --accent:#7c93ff; --accent-text:#0e0f14;
      --win-header:#262832; --win-bg:#1c1d24; --win-border:#3a3c48;
      --shadow:rgba(0,0,0,.5); --grid-dot:#33343e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#16171d; --panel:#202129; --panel-border:#33343e; --text:#eceef2;
    --muted:#9a9aa6; --accent:#7c93ff; --accent-text:#0e0f14;
    --win-header:#262832; --win-bg:#1c1d24; --win-border:#3a3c48;
    --shadow:rgba(0,0,0,.5); --grid-dot:#33343e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    overflow:hidden;
  }
  #viewport{
    position:fixed; inset:0; overflow:hidden; touch-action:none;
    background-image: radial-gradient(var(--grid-dot) 1.4px, transparent 1.4px);
    cursor:default;
  }
  #viewport.panning{cursor:grabbing;}
  #canvas{ position:absolute; top:0; left:0; width:0; height:0; transform-origin:0 0; }
  .win{
    position:absolute; min-width:150px; min-height:110px;
    background:var(--win-bg); border:1px solid var(--win-border); border-radius:10px;
    box-shadow:0 8px 24px var(--shadow); display:flex; flex-direction:column; overflow:hidden;
    user-select:none;
  }
  .win-header{
    background:var(--win-header); padding:8px 10px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--win-border);
    font-size:13px; font-weight:600;
  }
  /* qualquer elemento com essa classe serve de "pega" pra arrastar a janela — por padrão é o
     cabeçalho, mas uma janela sem cabeçalho (como a polaroid) pode usar outra área, como a legenda */
  .win-draghandle{ cursor:grab; touch-action:none; }
  .win-draghandle:active{ cursor:grabbing; }
  .win-title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none;}
  .win-header-btns{display:flex; align-items:center; flex:none; gap:4px;}
  .win-max, .win-close{
    width:20px; height:20px; border-radius:5px; border:none; background:transparent;
    color:var(--muted); font-size:13px; line-height:1; cursor:pointer; flex:none;
  }
  .win-max:hover, .win-close:hover{background:var(--panel-border); color:var(--text);}
  .win.maximized{ border-radius:0; }
  .win.polaroid{ border-radius:5px; box-shadow:0px 0px 8px 1px var(--shadow); }
  /* janelas "doc" (newdoc, newidoc, rundoc e variantes perma): sem cabeçalho, com uma aba lateral
     (como label de fichário antigo) que fica por baixo do "papel" no empilhamento visual */
  .win.doc-frame{ background:transparent; border:none; box-shadow:none; overflow:visible; }
  /* janela invisível da svg(): sem borda, sombra, fundo ou botões — só o conteúdo e a alça de redimensionar */
  .win.svg-frame{ background:transparent; border:none; box-shadow:none; }
  .svg-content{ position:absolute; inset:0; }
  .svg-content svg{ width:100%; height:100%; display:block; }
  .doc-paper{
    position:absolute; inset:0; display:flex; flex-direction:column;
    background:var(--win-bg); border:2px solid var(--win-border); border-radius:4px;
    box-shadow:0px 0px 8px 1px var(--shadow); overflow:hidden;
  }
  .doc-tab{
    position:absolute; top:70px; right:-16px; width:24px; box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 3px;
    background:var(--win-header); border:1px solid var(--win-border); border-right:none;
    border-radius:0 6px 6px 0;
  }
  .doc-tab-title{
    writing-mode:vertical-rl; text-orientation:mixed; pointer-events:none;
    font-size:11px; font-weight:600; color:var(--text);
    max-height:60px; overflow:hidden; white-space:nowrap;
  }
  /* maximizada, a janela "doc" vira cabeçalho no topo (como as demais), pra restaurar/fechar
     continuarem acessíveis — mesmo elemento (.doc-tab), só reposicionado via CSS */
  .win.doc-frame.maximized .doc-tab{
    top:0; left:0; right:0; width:auto; height:auto;
    flex-direction:row; align-items:center; justify-content:flex-start; gap:8px;
    padding:8px 10px; border-radius:0; border:none; border-bottom:1px solid var(--win-border);
  }
  .win.doc-frame.maximized .doc-tab-title{
    writing-mode:horizontal-tb; text-orientation:initial; max-height:none; flex:1;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .win.doc-frame.maximized .doc-paper{ top:38px; }
  .win.maximized .win-resize{display:none;}
  .win-body{
    flex:1; padding:10px; overflow:auto; outline:none; font-size:14px; user-select:text;
    color:var(--text);
  }
  .win-body.no-padding{ padding:0; }
  /* barra de rolagem das janelas (newwindow, newframe, run, permarun e variantes "perma") */
  .win-body, .polaroid-caption, #searchList{ scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .win-body::-webkit-scrollbar, .polaroid-caption::-webkit-scrollbar, #searchList::-webkit-scrollbar{
    width:8px; height:8px; background-color:transparent;
  }
  .win-body::-webkit-scrollbar-track, .polaroid-caption::-webkit-scrollbar-track, #searchList::-webkit-scrollbar-track{
    background-color:transparent;
  }
  .win-body::-webkit-scrollbar-thumb, .polaroid-caption::-webkit-scrollbar-thumb, #searchList::-webkit-scrollbar-thumb{
    background-image:repeating-linear-gradient(45deg, transparent 0, transparent 1px, var(--accent) 0, var(--accent) 25%);
    background-size:4px 4px;
    opacity:.5;
    border-radius:4px;
  }
  .win-body::-webkit-scrollbar-thumb:hover, .win-body::-webkit-scrollbar-thumb:active,
  .polaroid-caption::-webkit-scrollbar-thumb:hover, .polaroid-caption::-webkit-scrollbar-thumb:active,
  #searchList::-webkit-scrollbar-thumb:hover, #searchList::-webkit-scrollbar-thumb:active{ opacity:1; }
  /* remove as setinhas de incremento/decremento nas pontas da barra */
  .win-body::-webkit-scrollbar-button, .polaroid-caption::-webkit-scrollbar-button, #searchList::-webkit-scrollbar-button{
    display:none; width:0; height:0;
  }
  /* janela estilo polaroid */
  .polaroid-body{
    display:flex; flex-direction:column; background:#fdfdfa; color:#2b2b2b;
  }
  .polaroid-photo{
    flex:1; margin:14px 14px 0 14px; background:#111; overflow:hidden; position:relative; min-height:0;
  }
  .polaroid-photo img, .polaroid-photo video, .polaroid-photo iframe{
    width:100%; height:100%; border:none; display:block; object-fit:cover;
  }
  .polaroid-caption{
    position:relative; flex:0 0 auto; min-height:64px; max-height:40%; overflow:auto;
    padding:10px 16px 18px; text-align:left; font-size:14px; line-height:1.4;
  }
  .polaroid-caption-text{ padding-right:22px; }
  .polaroid-close{
    position:absolute; right:6px; bottom:6px; width:20px; height:20px; border-radius:5px;
    border:none; background:transparent; color:#8a8a8a; font-size:13px; line-height:1; cursor:pointer;
  }
  .polaroid-close:hover{ background:rgba(0,0,0,.08); color:#222; }

  .win-body.doc{ font-size:13px; line-height:1.5; }
  .doc h4{ margin:14px 0 4px; font-size:13px; }
  .doc h4:first-child{ margin-top:0; }
  .doc p{ margin:4px 0; }
  .doc ul{ margin:4px 0; padding-left:18px; }
  .doc code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px;
    background:var(--win-header); padding:1px 5px; border-radius:4px; }
  .doc .sig{ display:block; padding:6px 8px; margin:4px 0; color:var(--accent); }
  .doc hr{ border:none; border-top:1px solid var(--win-border); margin:12px 0; }
  .win-resize{
    position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize;
    touch-action:none;
    background:linear-gradient(135deg, transparent 50%, var(--win-border) 50%);
  }
  /* variante usada pela janela invisível de svg(): canto inferior esquerdo, diagonal espelhada */
  .win-resize.resize-bl{
    right:auto; left:0; cursor:nesw-resize;
    background:linear-gradient(45deg, transparent 50%, var(--win-border) 50%);
  }
  /* janela invisível (svg()): sem borda, sombra ou fundo — só o conteúdo svg e o redimensionador */
  .win.svg-frame{ background:transparent; border:none; box-shadow:none; }
  .svg-body{ background:transparent; padding:0; }
  .svg-content{ width:100%; height:100%; }
  .svg-content svg{ display:block; width:100%; height:100%; }
  #console{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(12px + env(safe-area-inset-bottom,0px));
    z-index:9999; width:min(520px, calc(100vw - 24px)); display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    padding:8px 10px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px;
    opacity:.55; box-shadow:0 4px 14px var(--shadow);
    transition:opacity .15s ease, box-shadow .15s ease;
  }
  /* após o 1º comando, o estado ocioso passa a ser totalmente transparente */
  #console.used{ opacity:0; }
  /* passar o mouse sempre mostra translúcido, mesmo já tendo sido usada */
  #console:hover{ opacity:.55; }
  /* em uso (clicada ou com foco via teclado): sempre opaca, por cima de tudo */
  #console:focus-within{
    opacity:1; box-shadow:0 16px 46px var(--shadow);
  }
  #console .prompt{color:var(--accent); flex:none;}
  #cmdInput{
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    font-family:inherit; font-size:13px;
  }
  #hint{color:var(--muted); font-size:11px; flex:none;}
  #viewControls{
    position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    z-index:9999; display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; padding:5px;
  }
  #viewControls button{
    width:32px; height:32px; border-radius:6px; border:none; background:transparent;
    color:var(--text); font-size:16px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #viewControls button:hover{background:var(--panel-border);}
  #zoomLabel{font-size:11px; color:var(--muted); padding:2px 0; text-align:center;}
  #viewControls hr{width:100%; border:none; border-top:1px solid var(--panel-border); margin:3px 0;}
  .link{ stroke:var(--accent); stroke-width:2; opacity:.85; }
  #searchPanel{
    position:fixed; right:64px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    z-index:9999; width:220px; max-height:360px; display:none; flex-direction:column;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px;
    box-shadow:0 8px 24px var(--shadow); overflow:hidden;
  }
  #searchPanel.open{ display:flex; }
  #searchInput{
    padding:8px 10px; border:none; border-bottom:1px solid var(--panel-border); outline:none;
    background:transparent; color:var(--text); font-size:13px; font-family:inherit;
  }
  #searchList{ overflow:auto; padding:4px; }
  #searchList button{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    color:var(--text); padding:6px 8px; border-radius:6px; font-size:13px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #searchList button:hover{ background:var(--panel-border); }
  #searchEmpty{ padding:8px 10px; color:var(--muted); font-size:12px; }
  body.controls-centered #viewControls{ top:50%; bottom:auto; transform:translateY(-50%); }
  body.controls-centered #searchPanel{ top:50%; bottom:auto; transform:translateY(-50%); }
  body.bg-transparent, body.bg-transparent html{ background:transparent !important; }
</style>
</head>
<body>
<div id="viewport">
  <div id="canvas">
    <svg id="linksLayer" width="1" height="1" style="position:absolute;top:0;left:0;overflow:visible;pointer-events:none;"></svg>
  </div>
</div>

<div id="console">
  <span class="prompt">&gt;</span>
  <input id="cmdInput" placeholder='digite help() para ver todos os comandos' autocomplete="off">
  <span id="hint">Enter</span>
</div>

<div id="searchPanel">
  <input id="searchInput" placeholder="Filtrar janelas..." autocomplete="off">
  <div id="searchList"></div>
</div>

<div id="viewControls">
  <button id="btnSearch" title="Buscar janela">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
  </button>
  <hr>
  <button id="btnZoomIn" title="Aumentar zoom">+</button>
  <span id="zoomLabel">100%</span>
  <button id="btnZoomOut" title="Diminuir zoom">−</button>
  <hr>
  <button id="btnReset" title="Centralizar">⌖</button>
  <button id="btnFullscreen" title="Tela cheia"></button>
</div>


<script>
(function(){
  var ICON_WIN_MAX = '<svg width="10" height="10" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/></svg>';
  var ICON_WIN_RESTORE = '<svg width="10" height="10" viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="7" r="4"/></svg>';
  var viewport = document.getElementById('viewport');
  var canvas = document.getElementById('canvas');
  var linksLayer = document.getElementById('linksLayer');
  var zoomLabel = document.getElementById('zoomLabel');
  var cmdInput = document.getElementById('cmdInput');
  var consoleBar = document.getElementById('console');
  var viewControls = document.getElementById('viewControls');
  var maximizedCount = 0;
  function updateUIVisibility() {
          var hide = maximizedCount > 0;
          // AJUSTE NECESSÁRIO PARA MUDANÇAS MANUAIS
          if (
            typeof $_GET["devmode"] != "undefined" &&
            $_GET["devmode"] != null &&
            $_GET["devmode"] != ""
          ) {
            consoleBar.style.display = hide ? "none" : "";
          }

          viewControls.style.display = hide ? "none" : "";
        }

  var pan = {x:0, y:0};
  var zoom = 1;
  var zTop = 1;
  var windows = [];
  var links = [];
  var idSeq = 1;

  function applyTransform(){
    canvas.style.transform = 'scale(' + zoom + ') translate(' + pan.x + 'px, ' + pan.y + 'px)';
    var grid = 32 * zoom;
    viewport.style.backgroundSize = grid + 'px ' + grid + 'px';
    viewport.style.backgroundPosition = (pan.x * zoom) + 'px ' + (pan.y * zoom) + 'px';
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
  }

  function screenToCanvas(sx, sy){
    var r = viewport.getBoundingClientRect();
    return { x: (sx - r.left) / zoom - pan.x, y: (sy - r.top) / zoom - pan.y };
  }

  // ---- temas de cor ----
  var THEME_VARS = ['bg','panel','panel-border','text','muted','accent','accent-text',
                     'win-header','win-bg','win-border','shadow','grid-dot'];
  var THEMES = {
    dracula: { bg:'#282a36', panel:'#21222c', 'panel-border':'#44475a', text:'#f8f8f2',
      muted:'#6272a4', accent:'#bd93f9', 'accent-text':'#282a36', 'win-header':'#343646',
      'win-bg':'#282a36', 'win-border':'#44475a', shadow:'rgba(0,0,0,.5)', 'grid-dot':'#44475a' },
    nord: { bg:'#2e3440', panel:'#3b4252', 'panel-border':'#4c566a', text:'#eceff4',
      muted:'#81a1c1', accent:'#88c0d0', 'accent-text':'#2e3440', 'win-header':'#434c5e',
      'win-bg':'#2e3440', 'win-border':'#4c566a', shadow:'rgba(0,0,0,.5)', 'grid-dot':'#434c5e' },
    'solarized-dark': { bg:'#002b36', panel:'#073642', 'panel-border':'#586e75', text:'#93a1a1',
      muted:'#657b83', accent:'#268bd2', 'accent-text':'#002b36', 'win-header':'#073642',
      'win-bg':'#002b36', 'win-border':'#586e75', shadow:'rgba(0,0,0,.5)', 'grid-dot':'#073642' },
    'solarized-light': { bg:'#fdf6e3', panel:'#eee8d5', 'panel-border':'#93a1a1', text:'#586e75',
      muted:'#93a1a1', accent:'#268bd2', 'accent-text':'#fdf6e3', 'win-header':'#eee8d5',
      'win-bg':'#fdf6e3', 'win-border':'#93a1a1', shadow:'rgba(0,0,0,.15)', 'grid-dot':'#eee8d5' },
    monokai: { bg:'#272822', panel:'#2d2e27', 'panel-border':'#49483e', text:'#f8f8f2',
      muted:'#75715e', accent:'#66d9ef', 'accent-text':'#272822', 'win-header':'#3e3d32',
      'win-bg':'#272822', 'win-border':'#49483e', shadow:'rgba(0,0,0,.5)', 'grid-dot':'#49483e' },
    'one-dark': { bg:'#282c34', panel:'#2c313a', 'panel-border':'#3e4451', text:'#abb2bf',
      muted:'#5c6370', accent:'#61afef', 'accent-text':'#282c34', 'win-header':'#333842',
      'win-bg':'#282c34', 'win-border':'#3e4451', shadow:'rgba(0,0,0,.5)', 'grid-dot':'#3e4451' },
    'gruvbox-dark': { bg:'#282828', panel:'#32302f', 'panel-border':'#504945', text:'#ebdbb2',
      muted:'#928374', accent:'#83a598', 'accent-text':'#282828', 'win-header':'#3c3836',
      'win-bg':'#282828', 'win-border':'#504945', shadow:'rgba(0,0,0,.5)', 'grid-dot':'#3c3836' },
    'github-dark': { bg:'#0d1117', panel:'#161b22', 'panel-border':'#30363d', text:'#c9d1d9',
      muted:'#8b949e', accent:'#58a6ff', 'accent-text':'#0d1117', 'win-header':'#161b22',
      'win-bg':'#0d1117', 'win-border':'#30363d', shadow:'rgba(0,0,0,.5)', 'grid-dot':'#21262d' }
  };
  function clearThemeOverrides(){
    THEME_VARS.forEach(function(v){ document.documentElement.style.removeProperty('--' + v); });
  }
  // aplica o tema visualmente; retorna true se o tema é válido
  function applyTheme(name){
    var key = String(name || '').trim().toLowerCase();
    if (key === 'auto' || key === 'system'){
      document.documentElement.removeAttribute('data-theme');
      clearThemeOverrides();
      if (typeof applyLineColors === 'function') applyLineColors();
      return 'auto';
    }
    if (key === 'light' || key === 'dark'){
      clearThemeOverrides();
      document.documentElement.setAttribute('data-theme', key);
      if (typeof applyLineColors === 'function') applyLineColors();
      return key;
    }
    var t = THEMES[key];
    if (!t){
      console.warn('Tema desconhecido: "' + name + '". Disponíveis: light, dark, auto, ' + Object.keys(THEMES).join(', '));
      return null;
    }
    document.documentElement.setAttribute('data-theme', key);
    THEME_VARS.forEach(function(v){ document.documentElement.style.setProperty('--' + v, t[v]); });
    if (typeof applyLineColors === 'function') applyLineColors(); // recalcula se multicolor() estiver ativo
    return key;
  }
  var THEME_STORAGE_KEY = 'infcanvas:theme';
  // aplica e registra no localStorage (persiste entre sessões)
  function setTheme(name){
    var applied = applyTheme(name);
    if (applied){
      try { localStorage.setItem(THEME_STORAGE_KEY, applied); } catch(e){ /* storage indisponível */ }
    }
  }
  // aplica sem registrar no localStorage
  function setTempTheme(name){ applyTheme(name); }
  window.setTheme = setTheme; // pode ser chamado pelo console do navegador também
  window.setTempTheme = setTempTheme;

  // ---- persistência de posição/tamanho por nome (localStorage) ----
  function storageKey(name){ return 'infcanvas:' + String(name).trim().toLowerCase(); }
  function saveWinState(win){
    try {
      var rec = {
        left: parseFloat(win.style.left), top: parseFloat(win.style.top),
        width: parseFloat(win.style.width), height: parseFloat(win.style.height)
      };
      localStorage.setItem(storageKey(win.dataset.name), JSON.stringify(rec));
    } catch(e){ /* storage indisponível: segue sem persistir */ }
  }
  function loadWinState(name){
    try {
      var raw = localStorage.getItem(storageKey(name));
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }

  // ---- criação de janelas ----
  // aceita número (px no espaço do canvas) ou string terminada em "%" (porcentagem da tela visível)
  function resolveDim(val, refScreenPx){
    if (typeof val === 'number') return val;
    if (typeof val === 'string'){
      var t = val.trim();
      if (/%$/.test(t)){
        var p = parseFloat(t);
        if (!isNaN(p)) return (refScreenPx * p / 100) / zoom;
      }
    }
    return undefined;
  }
  function resolveCoord(val, isX){
    if (typeof val === 'number') return val;
    if (typeof val === 'string'){
      var t = val.trim();
      if (/%$/.test(t)){
        var p = parseFloat(t);
        if (!isNaN(p)){
          var sx = isX ? viewport.clientWidth * p / 100 : 0;
          var sy = isX ? 0 : viewport.clientHeight * p / 100;
          var c = screenToCanvas(sx, sy);
          return isX ? c.x : c.y;
        }
      }
    }
    return undefined;
  }

  function resolvePosition(name, w, h, x, y, id){
    var center = screenToCanvas(viewport.clientWidth/2, viewport.clientHeight/2);
    var noPosArgs = (w === undefined && h === undefined && x === undefined && y === undefined);
    var saved = noPosArgs ? loadWinState(name) : null;
    if (saved) return saved;
    var rw = resolveDim(w, viewport.clientWidth);
    var rh = resolveDim(h, viewport.clientHeight);
    var rx = resolveCoord(x, true);
    var ry = resolveCoord(y, false);
    // sem w/h informado: no mínimo 65% da largura e 60% da altura da tela visível (no zoom atual)
    var defaultW = (viewport.clientWidth * 0.65) / zoom;
    var defaultH = (viewport.clientHeight * 0.6) / zoom;
    return {
      left: (typeof rx === 'number' ? rx : center.x - defaultW/2 + (id%5)*20),
      top: (typeof ry === 'number' ? ry : center.y - defaultH/2 + (id%5)*20),
      width: (typeof rw === 'number' ? rw : defaultW),
      height: (typeof rh === 'number' ? rh : defaultH)
    };
  }

  function createWindowShell(name, pos, bodyHtml, permanent, noHeader){
    var win = document.createElement('div');
    win.className = 'win' + (noHeader ? ' no-header' : '');

    win.style.left = pos.left + 'px';
    win.style.top  = pos.top + 'px';
    win.style.width  = pos.width + 'px';
    win.style.height = pos.height + 'px';
    win.style.zIndex = ++zTop;

    var headerHtml = noHeader ? '' :
      '<div class="win-header win-draghandle">' +
        '<span class="win-title">' + name + '</span>' +
        '<span class="win-header-btns">' +
          '<button class="win-max" title="Maximizar">' + ICON_WIN_MAX + '</button>' +
          (permanent ? '' : '<button class="win-close" title="Fechar">✕</button>') +
        '</span>' +
      '</div>';

    win.innerHTML = headerHtml + bodyHtml + '<div class="win-resize"></div>';

    canvas.appendChild(win);
    windows.push(win);
    wireWindow(win);
    return win;
  }

  // ---- moldura "doc": sem cabeçalho, aba lateral com título/fechar/maximizar, cantos levemente tortos ----
  // controla a rotação aleatória de TODAS as janelas "doc" (newdoc, newidoc, rundoc, suas variantes
  // perma, as versões "s" — newsdoc/newsidoc/runsdoc — e também a polaroid). ungroovy() por padrão.
  var groovyDocs = false;
  function createDocFrameShell(name, pos, bodyHtml, permanent){
    var win = document.createElement('div');
    win.className = 'win doc-frame';
    win.dataset.name = name;
    win.style.left = pos.left + 'px';
    win.style.top  = pos.top + 'px';
    win.style.width  = pos.width + 'px';
    win.style.height = pos.height + 'px';
    win.style.zIndex = ++zTop;

    // a aba (doc-tab) é o 1º filho, então pinta primeiro — o "papel" (doc-paper), pintado
    // depois, cobre a parte da aba que se sobrepõe a ele, incluindo a própria sombra do papel
    win.innerHTML =
      '<div class="doc-tab win-draghandle">' +
        '<span class="doc-tab-title">' + name + '</span>' +
        '<button class="win-max" title="Maximizar">' + ICON_WIN_MAX + '</button>' +
        (permanent ? '' : '<button class="win-close" title="Fechar">✕</button>') +
      '</div>' +
      '<div class="doc-paper">' + bodyHtml + '<div class="win-resize"></div></div>';

    canvas.appendChild(win);
    windows.push(win);
    wireWindow(win);
    if (groovyDocs) applyRandomTilt(win);
    return win;
  }
  // mantida como nome à parte por clareza de API — hoje se comporta exatamente igual à
  // createDocFrameShell, já que a rotação de ambas é regida pelo mesmo groovyDocs
  function createDocFrameShellStraight(name, pos, bodyHtml, permanent){
    return createDocFrameShell(name, pos, bodyHtml, permanent);
  }
  function groovy(){ groovyDocs = true; }
  function ungroovy(){ groovyDocs = false; }

  window.ungroovy = ungroovy;

  // ---- janela invisível com conteúdo SVG ----
  function createSvgShell(name, pos){

    win.style.left = pos.left + 'px';
    win.style.top  = pos.top + 'px';
    win.style.width  = pos.width + 'px';
    win.style.height = pos.height + 'px';
    win.style.zIndex = ++zTop;
    // sem cabeçalho, sem botões — o próprio conteúdo é a área de arrastar
    win.innerHTML = '<div class="svg-content win-draghandle"></div><div class="win-resize"></div>';
    canvas.appendChild(win);
    windows.push(win);
    wireWindow(win);
    return win;
  }

  function isLikelySvgUrl(str){
    var s = str.trim();
    if (s.indexOf('<') === 0) return false; // começa com "<": é código, não url
    var clean = s.split('?')[0].split('#')[0];
    return /\.svg$/i.test(clean);
  }
  function insertSvgCode(container, code){
    container.innerHTML = code;
    var svgEl = container.querySelector('svg');
    if (svgEl){
      // intercepta as dimensões do <svg> pra ocupar 100% da janela invisível
      svgEl.setAttribute('width', '100%');
      svgEl.setAttribute('height', '100%');
      svgEl.style.width = '100%';
      svgEl.style.height = '100%';
      svgEl.style.display = 'block';
    }
  }
  function svg(str, titulo, w, h, x, y){
    var id = idSeq++;
    var name = titulo || ('SVG ' + id);
    var pos = resolvePosition(name, w, h, x, y, id);
    var win = createSvgShell(name, pos);
    var container = win.querySelector('.svg-content');
    var raw = String(str || '');
    if (isLikelySvgUrl(raw)){
      fetch(raw)
        .then(function(res){
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function(text){ insertSvgCode(container, text); })
        .catch(function(err){
          console.warn('svg: não foi possível carregar "' + raw + '": ' + err.message);

    } else {
      insertSvgCode(container, raw);
    }
    return win;
  }
  window.svg = svg; // pode ser chamado pelo console do navegador também

  function makeWindow(permanent, title, w, h, x, y, shellFn){
    var id = idSeq++;
    var name = title || ('Janela ' + id);
    var pos = resolvePosition(name, w, h, x, y, id);
    var bodyHtml = '<div class="win-body" contenteditable="true" spellcheck="false">Escreva aqui…</div>';
    return (shellFn || createWindowShell)(name, pos, bodyHtml, permanent);
  }
  function newwindow(title, w, h, x, y){ return makeWindow(false, title, w, h, x, y); }
  function newpermawindow(title, w, h, x, y){ return makeWindow(true, title, w, h, x, y); }
  function newdoc(title, w, h, x, y){ return makeWindow(false, title, w, h, x, y, createDocFrameShell); }
  function newpermadoc(title, w, h, x, y){ return makeWindow(true, title, w, h, x, y, createDocFrameShell); }
  function newsdoc(title, w, h, x, y){ return makeWindow(false, title, w, h, x, y, createDocFrameShellStraight); }
  function newpermasdoc(title, w, h, x, y){ return makeWindow(true, title, w, h, x, y, createDocFrameShellStraight); }
  window.newwindow = newwindow; // pode ser chamado pelo console do navegador também
  window.newpermawindow = newpermawindow;
  window.newdoc = newdoc;
  window.newpermadoc = newpermadoc;
  window.newsdoc = newsdoc;
  window.newpermasdoc = newpermasdoc;

  // ---- carregamento preguiçoso de iframes (só recebem "src" quando entram na área visível) ----
  var IFRAME_ALLOW = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; allowfullscreen';
  var LAZY_MARGIN = 200; // px de folga antes de a área ficar visível, pra já ir carregando um pouco antes
  var lazyFrames = [];

  function buildLazyIframeHtml(url){
    var safeUrl = String(url || '').replace(/"/g, '&quot;');
    // "temp" guarda a url real; "src" só é preenchido quando o iframe entra na área visível do canvas
    return '<iframe temp="' + safeUrl + '" allow="' + IFRAME_ALLOW + '" allowfullscreen ' +
           'style="width:100%;height:100%;border:none;display:block;"></iframe>';
  }
  // outros pontos do código (inclusive implementações manuais futuras) podem registrar
  // um iframe próprio pra entrar nesse mesmo esquema de carregamento preguiçoso
  function registerLazyFrame(iframeEl){
    if (iframeEl && iframeEl.getAttribute('temp')) lazyFrames.push(iframeEl);
  }
  window.registerLazyFrame = registerLazyFrame;

  function checkLazyFrames(){
    if (lazyFrames.length === 0) return;
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    for (var i = lazyFrames.length - 1; i >= 0; i--){
      var ifr = lazyFrames[i];
      if (!ifr.isConnected){ lazyFrames.splice(i, 1); continue; }
      // getBoundingClientRect já reflete a posição real na tela, incluindo o zoom/pan do canvas —
      // não precisamos fazer nenhuma conta extra de zoom, o navegador já faz isso por nós
      var r = ifr.getBoundingClientRect();
      var visible = r.right > -LAZY_MARGIN && r.left < vw + LAZY_MARGIN &&
                    r.bottom > -LAZY_MARGIN && r.top < vh + LAZY_MARGIN;
      if (visible){
        if (!ifr.getAttribute('src')){
          var temp = ifr.getAttribute('temp');
          if (temp) ifr.setAttribute('src', temp);
        }
        lazyFrames.splice(i, 1); // já carregou uma vez: não precisa mais verificar essa janela
      }
    }
  }

  // ---- janela com iframe ----
  function makeFrame(permanent, url, title, w, h, x, y, shellFn){
    var id = idSeq++;
    var name = title || url || ('Frame ' + id);
    var pos = resolvePosition(name, w, h, x, y, id);
    var bodyHtml =
      '<div class="win-body no-padding">' +
        buildLazyIframeHtml(url) +
      '</div>';
    var win = (shellFn || createWindowShell)(name, pos, bodyHtml, permanent);
    registerLazyFrame(win.querySelector('iframe[temp]'));
    return win;
  }
  function newframe(url, title, w, h, x, y){ return makeFrame(false, url, title, w, h, x, y); }
  function newpermaframe(url, title, w, h, x, y){ return makeFrame(true, url, title, w, h, x, y); }
  function newidoc(url, title, w, h, x, y){ return makeFrame(false, url, title, w, h, x, y, createDocFrameShell); }
  function newpermaidoc(url, title, w, h, x, y){ return makeFrame(true, url, title, w, h, x, y, createDocFrameShell); }
  function newsidoc(url, title, w, h, x, y){ return makeFrame(false, url, title, w, h, x, y, createDocFrameShellStraight); }
  function newpermasidoc(url, title, w, h, x, y){ return makeFrame(true, url, title, w, h, x, y, createDocFrameShellStraight); }
  window.newframe = newframe; // pode ser chamado pelo console do navegador também
  window.newpermaframe = newpermaframe;
  window.newidoc = newidoc;
  window.newpermaidoc = newpermaidoc;
  window.newsidoc = newsidoc;
  window.newpermasidoc = newpermasidoc;

  // ---- janela que executa uma função JS definida pelo usuário ----
  function makeRun(permanent, title, fnName, params, w, h, x, y, shellFn){
    var id = idSeq++;
    var name = title || ('Run ' + id);
    var pos = resolvePosition(name, w, h, x, y, id);
    var domId = 'newrun' + id;
    var bodyHtml = '<div class="win-body no-padding" id="' + domId + '"></div>';
    var win = (shellFn || createWindowShell)(name, pos, bodyHtml, permanent);
    var fn = window[fnName];
    if (typeof fn !== 'function'){
      console.warn('run: função "' + fnName + '" não encontrada em window. Defina-a (window.' + fnName + ' = function(id, params){...}) antes de chamar run().');
    } else {
      try { fn(domId, params); }
      catch (err){ console.warn('run: erro ao executar "' + fnName + '":', err.message); }
    }
    return win;
  }
  function run(title, fnName, params, w, h, x, y){ return makeRun(false, title, fnName, params, w, h, x, y); }
  function permarun(title, fnName, params, w, h, x, y){ return makeRun(true, title, fnName, params, w, h, x, y); }
  function rundoc(title, fnName, params, w, h, x, y){ return makeRun(false, title, fnName, params, w, h, x, y, createDocFrameShell); }
  function runpermadoc(title, fnName, params, w, h, x, y){ return makeRun(true, title, fnName, params, w, h, x, y, createDocFrameShell); }
  function runsdoc(title, fnName, params, w, h, x, y){ return makeRun(false, title, fnName, params, w, h, x, y, createDocFrameShellStraight); }
  function runpermasdoc(title, fnName, params, w, h, x, y){ return makeRun(true, title, fnName, params, w, h, x, y, createDocFrameShellStraight); }
  window.run = run; // pode ser chamado pelo console do navegador também
  window.permarun = permarun;
  window.rundoc = rundoc;
  window.runpermadoc = runpermadoc;
  window.runsdoc = runsdoc;
  window.runpermasdoc = runpermasdoc;

  // ---- janela estilo polaroid ----
  var POLAROID_MARGIN = 14; // ver margem de .polaroid-photo no CSS

  function getPolaroidType(url){
    var u = String(url || '');
    var clean = u.split('?')[0].split('#')[0];
    var ext = (clean.match(/\.([a-zA-Z0-9]+)$/) || ['', ''])[1].toLowerCase();
    if (['jpg', 'jpeg', 'png', 'webp', 'gif'].indexOf(ext) !== -1) return 'image';
    if (ext === 'mp4') return 'video';
    return 'other';
  }
  function polaroidContentHtml(url, type){
    var safeUrl = String(url || '').replace(/"/g, '&quot;');
    if (type === 'image') return '<img src="' + safeUrl + '" alt="">';
    if (type === 'video') return '<video src="' + safeUrl + '" controls></video>';
    // nem imagem, nem vídeo: entra como iframe, com o mesmo carregamento preguiçoso da newframe
    return buildLazyIframeHtml(url);
  }
  function isAutoVal(v){ return typeof v === 'string' && v.trim().toLowerCase() === 'auto'; }

  // leve torção aleatória (até 4°, pra qualquer lado), usada por polaroid e pelas janelas "doc"
  function applyRandomTilt(win){
    var deg = Math.random() * 8 - 4;
    win._rotationDeg = deg;
    win.style.transform = 'rotate(' + deg.toFixed(2) + 'deg)';
  }

  function polaroid(url, texto, titulo, w, h, x, y){
    var id = idSeq++;
    var name = titulo || ('Polaroid ' + id);
    var type = getPolaroidType(url);
    var autoW = isAutoVal(w), autoH = isAutoVal(h);

    // "auto" só faz sentido pra imagem/vídeo (que têm proporção própria) e só faz sentido
    // informar um dos dois — fora isso, cai no tamanho padrão
    if ((autoW || autoH) && type === 'other'){
      console.warn('polaroid: "auto" em w/h só é suportado para imagens e vídeos; usando o padrão nesta janela.');
      autoW = false; autoH = false;
    }
    if (autoW && autoH){
      console.warn('polaroid: w e h não podem ser "auto" ao mesmo tempo; informe pelo menos um valor. Usando o padrão.');
      autoW = false; autoH = false;
    }
    if (isAutoVal(w) && !autoW) w = undefined; // "auto" descartado pelos avisos acima
    if (isAutoVal(h) && !autoH) h = undefined;

    var pos = resolvePosition(name, autoW ? undefined : w, autoH ? undefined : h, x, y, id);
    var bodyHtml =
      '<div class="win-body no-padding polaroid-body win-draghandle">' +
        '<div class="polaroid-photo">' + polaroidContentHtml(url, type) + '</div>' +
        '<div class="polaroid-caption">' +
          '<div class="polaroid-caption-text">' + (texto || '') + '</div>' +
          '<button class="win-close polaroid-close" title="Fechar">✕</button>' +
        '</div>' +
      '</div>';
    // sem cabeçalho (nem título, nem maximizar/restaurar) — arrasta-se pela legenda,
    // que também carrega o único .win-close desta janela
    var win = createWindowShell(name, pos, bodyHtml, true, true);
    win.classList.add('polaroid');
    var ifr = win.querySelector('.polaroid-photo iframe[temp]');
    if (ifr) registerLazyFrame(ifr);

    if (groovyDocs) applyRandomTilt(win);

    // ajusta o tamanho pra respeitar a proporção da imagem/vídeo quando w ou h é "auto",
    // em vez de distorcer o conteúdo pra caber numa caixa com proporção arbitrária
    if (autoW || autoH){
      var mediaEl = win.querySelector('.polaroid-photo img, .polaroid-photo video');
      var captionEl = win.querySelector('.polaroid-caption');
      if (mediaEl){
        var applyAspect = function(){
          var nw = mediaEl.naturalWidth || mediaEl.videoWidth;
          var nh = mediaEl.naturalHeight || mediaEl.videoHeight;
          if (!nw || !nh) return;
          var ratio = nh / nw;
          var captionH = captionEl.offsetHeight;
          if (autoH){
            var photoW = parseFloat(win.style.width) - POLAROID_MARGIN * 2;
            win.style.height = (POLAROID_MARGIN + photoW * ratio + captionH) + 'px';
          } else { // autoW
            var photoH = parseFloat(win.style.height) - POLAROID_MARGIN - captionH;
            win.style.width = (photoH / ratio + POLAROID_MARGIN * 2) + 'px';
          }
        };
        if (mediaEl.tagName === 'IMG'){
          if (mediaEl.complete && mediaEl.naturalWidth) applyAspect();
          else mediaEl.addEventListener('load', applyAspect);
        } else if (mediaEl.tagName === 'VIDEO'){
          if (mediaEl.readyState >= 1) applyAspect();
          else mediaEl.addEventListener('loadedmetadata', applyAspect);
        }
      }
    }
    return win;
  }

  // ---- ajuda ----
  var HELP_HTML = `
<h4>Como usar</h4>
<p>Digite uma instrução JavaScript na barra de comando e pressione Enter. As funções abaixo também podem ser chamadas pelo console do navegador (DevTools). Para navegar, arraste o fundo vazio com o botão direito ou o do meio do mouse. O scroll dá zoom apenas quando o mouse está sobre o fundo, não sobre uma janela.</p>
<p>A ordem dos parâmetros de posição/tamanho é sempre <code>w, h, x, y</code> (largura, altura, x, y) — dá para informar só <code>w</code> e <code>h</code> e deixar <code>x, y</code> de fora. Cada um aceita um número (pixels do espaço do canvas) ou uma string terminada em <code>%</code> (porcentagem da tela visível no momento, ex.: <code>"50%"</code>, <code>"40%"</code>). Todos são sempre opcionais. Sem <code>w</code>/<code>h</code> informados (e sem nome já registrado), a janela nasce com pelo menos 65% da largura e 60% da altura da tela visível. Se uma janela é criada só com um nome já registrado (sem w, h, x, y), ela reabre na posição e no tamanho em que foi deixada. Valores explícitos têm prioridade sobre o registro.</p>
<p>Ao maximizar uma janela, o zoom do ambiente é zerado para 100% antes dela ocupar a tela — assim o cabeçalho e os botões não ficam desproporcionais. Ao restaurar, o zoom volta exatamente ao valor de antes de maximizar.</p>
<hr>
<h4>Janelas</h4>
<code class="sig">newwindow(título, w, h, x, y)</code>
<p>Janela de texto editável, com padding. Sem título, usa "Janela N".</p>
<code class="sig">newpermawindow(título, w, h, x, y)</code>
<p>Igual à <code>newwindow</code>, mas sem botão de fechar (permanente no canvas).</p>
<code class="sig">newframe(url, título, w, h, x, y)</code>
<p>Janela com um iframe ocupando todo o espaço, sem padding. Sem título, usa a url. Muitos sites bloqueiam exibição em iframe. O carregamento é preguiçoso: o iframe só recebe a url de verdade quando entra na área visível da tela (considerando zoom e pan), para não pesar quando há muitas janelas abertas de uma vez.</p>
<code class="sig">newpermaframe(url, título, w, h, x, y)</code>
<p>Igual à <code>newframe</code>, mas sem botão de fechar.</p>
<code class="sig">run(título, nomeDaFuncao, params, w, h, x, y)</code>
<p>Cria uma janela sem padding, cujo corpo recebe um id gerado (<code>newrun1</code>, <code>newrun2</code>...) e executa <code>window[nomeDaFuncao](id, params)</code>. O primeiro argumento da sua função é sempre a string com o id; o segundo é o valor de <code>params</code>. A função precisa existir em <code>window</code> (ex.: <code>window.minhaFuncao = function(id, params){...}</code>).</p>
<p>Exemplo: <code>run("Label", "minhaFuncao", {a: 1}, 600, 400, 300, 200)</code> (largura 600, altura 400, x=300, y=200) — ou <code>run("Label", "minhaFuncao", {a: 1}, "50%", "40%")</code> para 50% da largura e 40% da altura da tela, sem fixar posição.</p>
<code class="sig">permarun(título, nomeDaFuncao, params, w, h, x, y)</code>
<p>Igual à <code>run</code>, mas sem botão de fechar.</p>
<hr>
<h4>Polaroid</h4>
<code class="sig">polaroid(url, texto, título, w, h, x, y)</code>
<p>Janela com moldura branca estilo foto polaroid: bordas largas em volta do conteúdo e uma faixa maior
embaixo com uma legenda. <code>url</code> decide o conteúdo pela extensão: imagem (<code>.jpg</code>,
<code>.jpeg</code>, <code>.png</code>, <code>.webp</code>, <code>.gif</code>) aparece como foto,
<code>.mp4</code> aparece como vídeo (com controles), qualquer outra url vira um iframe (com o mesmo
carregamento preguiçoso da <code>newframe</code>). <code>texto</code> é HTML (pode ser só texto simples)
mostrado na legenda (mesma fonte da <code>newwindow</code>, alinhado à esquerda). <code>título</code>
funciona como nome da janela para <code>connect</code>/<code>disconnect</code>, igual às demais. Essa
janela não tem cabeçalho, título visível nem botão de maximizar/restaurar — arrasta-se pela própria
legenda (embaixo), que também é onde fica o botão de fechar. Ainda dá pra redimensionar pela alça do
canto. A rotação aleatória (até 4°, pra um lado ou pro outro) é controlada por <code>groovy()</code>/
<code>ungroovy()</code> (ver seção "Janelas doc" mais abaixo) — por padrão (<code>ungroovy</code>), a
polaroid nasce alinhada ao eixo, sem torção. Em
<code>w</code> ou <code>h</code> (nunca nos dois ao mesmo tempo), também aceita o valor <code>"auto"</code>
quando o conteúdo é imagem ou vídeo: a dimensão informada é respeitada e a outra é calculada a partir da
proporção original do conteúdo, sem distorcer.</p>
<hr>
<h4>Janelas "doc"</h4>
<p>Seis variantes com a mesma moldura: sem cabeçalho no topo, borda fina de 2px, cantos quase retos,
sombra mais discreta e (dependendo de <code>groovy()</code>/<code>ungroovy()</code>, ver abaixo) uma leve
rotação aleatória de até 4°, igual à polaroid. A diferença é que, em vez de legenda embaixo, o título e
os botões de maximizar/restaurar (e fechar, quando existe) ficam numa
aba estreita na lateral direita, começando uns 70px abaixo do topo — como a etiqueta de um fichário
antigo. Essa aba é a área de arrastar a janela, e fica por baixo do "papel" no empilhamento visual: a
sombra da janela passa por cima dela. Ao maximizar, essa mesma aba vira uma barra de título normal no
topo (como as demais janelas), pra restaurar/fechar continuarem acessíveis; ao restaurar, ela volta a
ser a aba lateral. Cada uma corresponde a uma função já existente, só na moldura "doc":</p>
<code class="sig">newdoc(título, w, h, x, y)</code> — igual à <code>newwindow</code>.<br>
<code class="sig">newpermadoc(título, w, h, x, y)</code> — igual à <code>newpermawindow</code> (sem botão de fechar).<br>
<code class="sig">newidoc(url, título, w, h, x, y)</code> — igual à <code>newframe</code>.<br>
<code class="sig">newpermaidoc(url, título, w, h, x, y)</code> — igual à <code>newpermaframe</code>.<br>
<code class="sig">rundoc(título, nomeDaFuncao, params, w, h, x, y)</code> — igual à <code>run</code>.<br>
<code class="sig">runpermadoc(título, nomeDaFuncao, params, w, h, x, y)</code> — igual à <code>permarun</code>.
<p>Também existe uma versão de cada uma com "s" no nome (<code>newsdoc</code>, <code>newsidoc</code>,
<code>runsdoc</code>, <code>newpermasdoc</code>, <code>newpermasidoc</code>, <code>runpermasdoc</code>) —
hoje idênticas em tudo às seis acima (mantidas como nomes à parte por clareza de API).</p>
<code class="sig">ungroovy()</code>
<p>Nenhuma janela "doc" (nem suas variantes "s", nem a <code>polaroid</code>) recebe rotação — todas nascem a 0°, alinhadas ao eixo. Padrão inicial.</p>
<code class="sig">groovy()</code>
<p>Todas as janelas "doc" (variantes "s" incluídas) e a <code>polaroid</code> voltam a nascer com rotação aleatória entre -4° e 4°.</p>
<hr>
<h4>SVG</h4>
<code class="sig">svg(string, título, w, h, x, y)</code>
<p>Janela completamente invisível: sem borda, sombra, fundo, cabeçalho, nem botões de maximizar ou
fechar — só o conteúdo SVG e, no canto inferior direito, a alça de redimensionar. O próprio conteúdo é a
área de arrastar. <code>string</code> pode ser uma URL terminada em <code>.svg</code> (nesse caso o
arquivo é buscado por <code>fetch</code> e seu texto inserido como código — sujeito às mesmas regras de
CORS de qualquer <code>fetch</code>; uma URL de outro domínio sem CORS liberado não vai carregar) ou o
próprio código SVG como string (texto começando com <code>&lt;</code>). O <code>width</code> e
<code>height</code> da tag <code>&lt;svg&gt;</code> são sobrescritos para 100%, preenchendo toda a
janela. <code>título</code> não aparece em lugar nenhum visualmente — serve só para localizar essa
janela invisível pela lupa ou referenciá-la em <code>connect</code>/<code>disconnect</code>.</p>
<hr>
<h4>Conexões</h4>
<code class="sig">connect(nomeA, nomeB)</code>
<p>Desenha uma linha entre o centro de duas janelas, identificadas pelo título exato (sem diferenciar maiúsculas). A linha acompanha movimento e redimensionamento. Ela some enquanto uma das janelas está maximizada e é removida se uma delas for fechada.</p>
<code class="sig">disconnect(nomeA, nomeB)</code>
<p>Remove a linha entre as duas janelas, em qualquer ordem.</p>
<code class="sig">multicolor()</code>
<p>Cada linha desenhada por <code>connect</code> passa a ter uma cor diferente (matiz espalhado uniformemente), mantendo a mesma saturação e luminosidade da cor de destaque (<code>--accent</code>) do tema atual. Ajuda a distinguir qual janela está ligada a qual quando há várias conexões. Acompanha a troca de tema automaticamente.</p>
<code class="sig">singlecolor()</code>
<p>Volta todas as linhas a usar a cor de destaque única do tema (padrão).</p>
<hr>
<h4>Temas</h4>
<code class="sig">setTheme(nome)</code>
<p>Aplica o tema e registra no localStorage; ele será usado nas próximas vezes que a ferramenta abrir.</p>
<code class="sig">setTempTheme(nome)</code>
<p>Aplica o tema sem registrar no localStorage.</p>
<p>Nomes aceitos: <code>auto</code> (segue o sistema), <code>light</code>, <code>dark</code>, <code>dracula</code>, <code>nord</code>, <code>solarized-dark</code>, <code>solarized-light</code>, <code>monokai</code>, <code>one-dark</code>, <code>gruvbox-dark</code>, <code>github-dark</code>.</p>
<hr>
<h4>Zoom e posição</h4>
<code class="sig">setZoom(nivel)</code>
<p>Define o zoom diretamente (1 = 100%, 0.5 = 50%, 2 = 200%...), sem precisar simular scroll ou cliques nos botões de zoom. Fica limitado entre 20% e 400%, como o zoom manual.</p>
<code class="sig">setPan(x, y)</code>
<p>Desloca o canvas diretamente para as coordenadas <code>x, y</code> (em pixels do espaço do canvas), sem precisar simular arrastar o fundo. Útil pra implementações manuais que queiram levar o usuário a um ponto específico.</p>
<code class="sig">center(título)</code>
<p>Encontra a janela com esse título exato e centraliza o canvas nela (mantendo o zoom atual), além de trazê-la pra frente de todas as outras — o mesmo que acontece ao escolher uma janela na lista da lupa, só que por código.</p>
<hr>
<h4>Embutir / integrar</h4>
<code class="sig">centerControls()</code>
<p>Move o bloco de controles (lupa, zoom, centralizar, tela cheia) e o painel de busca para o centro vertical da tela, em vez do canto inferior direito.</p>
<code class="sig">bottomControls()</code>
<p>Devolve o bloco de controles e o painel de busca para a posição padrão, no canto inferior direito.</p>
<code class="sig">setTransparentBackground()</code>
<p>Torna o fundo do ambiente transparente, para integrar melhor quando o Canvas Infinito é embutido sobre outra interface.</p>
<code class="sig">setOpaqueBackground()</code>
<p>Devolve o fundo do ambiente à cor sólida do tema atual.</p>
<hr>
<h4>Ajuda</h4>
<code class="sig">help()</code>
<p>Abre esta janela. Se ela já estiver aberta, apenas a traz para a frente.</p>
`;
  function help(){
    var name = 'Ajuda';
    var existing = findWindowByName(name);
    if (existing){ bringToFront(existing); return existing; }
    var saved = loadWinState(name);
    var pos;
    if (saved){
      pos = saved;
    } else {
      var c = screenToCanvas(viewport.clientWidth/2, viewport.clientHeight/2);
      pos = { left: c.x - 280, top: c.y - 250, width: 560, height: 500 };
    }
    var bodyHtml = '<div class="win-body doc">' + HELP_HTML + '</div>';
    return createWindowShell(name, pos, bodyHtml, false);
  }
  window.help = help; // pode ser chamado pelo console do navegador também

  // ---- conectar janelas por nome ----
  function findWindowByName(name){
    var target = String(name).trim().toLowerCase();
    return windows.find(function(w){ return w.dataset.name.toLowerCase() === target; });
  }
  function connect(nameA, nameB){
    var a = findWindowByName(nameA), b = findWindowByName(nameB);
    if (!a || !b){ console.warn('connect: janela não encontrada ("' + nameA + '" ou "' + nameB + '")'); return null; }
    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('class', 'link');
    linksLayer.appendChild(line);
    var link = { a:a, b:b, el:line };
    links.push(link);
    applyLineColors();
    return link;
  }
  window.connect = connect; // pode ser chamado pelo console do navegador também

  function disconnect(nameA, nameB){
    var a = findWindowByName(nameA), b = findWindowByName(nameB);
    if (!a || !b){ console.warn('disconnect: janela não encontrada ("' + nameA + '" ou "' + nameB + '")'); return; }
    links = links.filter(function(l){
      var match = (l.a === a && l.b === b) || (l.a === b && l.b === a);
      if (match) l.el.remove();
      return !match;
    });
    applyLineColors();
  }
  window.disconnect = disconnect; // pode ser chamado pelo console do navegador também

  // ---- cores das linhas do connect(): uma só cor (padrão) ou uma cor por linha ----
  var multicolorLinks = false;
  function hexToHsl(hex){
    var m = String(hex || '').trim().replace('#', '');
    if (m.length === 3) m = m.split('').map(function(c){ return c + c; }).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(m)) return null;
    var r = parseInt(m.substr(0, 2), 16) / 255;
    var g = parseInt(m.substr(2, 2), 16) / 255;
    var b = parseInt(m.substr(4, 2), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h, s, l = (max + min) / 2;
    if (max === min){ h = s = 0; }
    else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return { h: h, s: s * 100, l: l * 100 };
  }
  function applyLineColors(){
    if (!multicolorLinks){
      links.forEach(function(l){ l.el.style.stroke = ''; }); // volta a usar o var(--accent) do CSS
      return;
    }
    var accentHex = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    var hsl = hexToHsl(accentHex) || { h: 0, s: 65, l: 60 }; // mesma saturação/luminosidade da cor base do tema
    var n = links.length || 1;
    links.forEach(function(l, i){
      var hue = Math.round(360 * i / n);
      l.el.style.stroke = 'hsl(' + hue + ', ' + hsl.s.toFixed(0) + '%, ' + hsl.l.toFixed(0) + '%)';
    });
  }
  function multicolor(){ multicolorLinks = true; applyLineColors(); }
  function singlecolor(){ multicolorLinks = false; applyLineColors(); }
  window.multicolor = multicolor; // pode ser chamado pelo console do navegador também
  window.singlecolor = singlecolor;

  function updateLinks(){
    links = links.filter(function(l){
      if (!l.a.isConnected || !l.b.isConnected){ l.el.remove(); return false; }
      return true;
    });
    links.forEach(function(l){
      if (l.a.classList.contains('maximized') || l.b.classList.contains('maximized')){
        l.el.style.display = 'none';
        return;
      }
      l.el.style.display = '';
      var ax = parseFloat(l.a.style.left) + l.a.offsetWidth / 2;
      var ay = parseFloat(l.a.style.top) + l.a.offsetHeight / 2;
      var bx = parseFloat(l.b.style.left) + l.b.offsetWidth / 2;
      var by = parseFloat(l.b.style.top) + l.b.offsetHeight / 2;
      l.el.setAttribute('x1', ax); l.el.setAttribute('y1', ay);
      l.el.setAttribute('x2', bx); l.el.setAttribute('y2', by);
    });
  }
  function fitMaximizedWindow(win){
    // calcula o retângulo, em coordenadas do canvas, que corresponde à tela cheia
    // no zoom/pan atuais — assim a janela cobre a tela inteira sem nunca sair do DOM
    var tl = screenToCanvas(0, 0);
    var br = screenToCanvas(viewport.clientWidth, viewport.clientHeight);
    win.style.left = tl.x + 'px';
    win.style.top = tl.y + 'px';
    win.style.width = (br.x - tl.x) + 'px';
    win.style.height = (br.y - tl.y) + 'px';
  }

  (function frameLoop(){
    updateLinks();
    checkLazyFrames();
    windows.forEach(function(w){
      if (w.classList.contains('maximized')) fitMaximizedWindow(w);
    });
    requestAnimationFrame(frameLoop);
  })();

  function bringToFront(win){ win.style.zIndex = ++zTop; }

  function wireWindow(win){
    var dragHandle = win.querySelector('.win-draghandle');
    var body = win.querySelector('.win-body');
    var resize = win.querySelector('.win-resize');
    var closeBtn = win.querySelector('.win-close');
    var maxBtn = win.querySelector('.win-max'); // pode não existir (ex.: janelas sem cabeçalho)

    if (closeBtn) closeBtn.addEventListener('click', function(){
      if (win.classList.contains('maximized')){
        var r = win._restore;
        win.style.left = r.left; win.style.top = r.top;
        win.style.width = r.width; win.style.height = r.height;
        if (typeof r.zoom === 'number'){ zoom = r.zoom; applyTransform(); }
        maximizedCount--; updateUIVisibility();
      }
      saveWinState(win);
      win.remove();
      windows = windows.filter(function(w){ return w !== win; });
    });

    if (maxBtn){
      var toggleMaximize = function(){
        if (win.classList.contains('maximized')){
          var r = win._restore;
          win.classList.remove('maximized');
          win.style.left = r.left; win.style.top = r.top;
          win.style.width = r.width; win.style.height = r.height;
          win.style.zIndex = r.zIndex;
          if (typeof r.zoom === 'number'){ zoom = r.zoom; applyTransform(); }
          if (win._rotationDeg !== undefined){
            win.style.transform = 'rotate(' + win._rotationDeg.toFixed(2) + 'deg)';
          }
          maxBtn.innerHTML = ICON_WIN_MAX; maxBtn.title = 'Maximizar';
          maximizedCount--; updateUIVisibility();
        } else {
          win._restore = {
            left: win.style.left, top: win.style.top,
            width: win.style.width, height: win.style.height,
            zIndex: win.style.zIndex,
            zoom: zoom
          };
          // zera o zoom antes de ocupar a tela: se o zoom estivesse diferente de 100%, o
          // cabeçalho e os botões (medidos em px fixos) ficariam desproporcionais à tela cheia
          zoom = 1;
          applyTransform();
          win.classList.add('maximized');
          win.style.zIndex = ++zTop;
          if (win._rotationDeg !== undefined){ win.style.transform = 'none'; }
          fitMaximizedWindow(win);
          maxBtn.innerHTML = ICON_WIN_RESTORE; maxBtn.title = 'Restaurar';
          maximizedCount++; updateUIVisibility();
        }
      };
      maxBtn.addEventListener('click', function(e){ e.stopPropagation(); toggleMaximize(); });
    }

    win.addEventListener('pointerdown', function(){
      if (!win.classList.contains('maximized')) bringToFront(win);
    });

    // mover
    if (dragHandle) dragHandle.addEventListener('pointerdown', function(e){
      if (e.target.closest('.win-close') || e.target.closest('.win-max')) return;
      if (win.classList.contains('maximized')) return;
      e.preventDefault();
      bringToFront(win);
      var startX = e.clientX, startY = e.clientY;
      var origLeft = parseFloat(win.style.left), origTop = parseFloat(win.style.top);
      dragHandle.setPointerCapture(e.pointerId);
      function onMove(ev){
        var dx = (ev.clientX - startX) / zoom;
        var dy = (ev.clientY - startY) / zoom;
        win.style.left = (origLeft + dx) + 'px';
        win.style.top  = (origTop + dy) + 'px';
      }
      function onUp(ev){
        dragHandle.releasePointerCapture(e.pointerId);
        dragHandle.removeEventListener('pointermove', onMove);
        dragHandle.removeEventListener('pointerup', onUp);
        saveWinState(win);
      }
      dragHandle.addEventListener('pointermove', onMove);
      dragHandle.addEventListener('pointerup', onUp);
    });

    // redimensionar — padrão pelo canto inferior direito; ".resize-bl" inverte pro inferior esquerdo
    // (usada pela janela invisível de svg()), ancorando o canto superior direito em vez do esquerdo
    resize.addEventListener('pointerdown', function(e){
      if (win.classList.contains('maximized')) return;
      e.preventDefault(); e.stopPropagation();
      bringToFront(win);
      var fromLeft = resize.classList.contains('resize-bl');
      var startX = e.clientX, startY = e.clientY;
      var origW = win.offsetWidth, origH = win.offsetHeight;
      var origLeft = parseFloat(win.style.left);
      var rightEdge = origLeft + origW;
      resize.setPointerCapture(e.pointerId);
      function onMove(ev){
        var dx = (ev.clientX - startX) / zoom;
        var dy = (ev.clientY - startY) / zoom;
        if (fromLeft){
          var newW = Math.max(150, origW - dx);
          win.style.width = newW + 'px';
          win.style.left = (rightEdge - newW) + 'px';
        } else {
          win.style.width = Math.max(150, origW + dx) + 'px';
        }
        win.style.height = Math.max(110, origH + dy) + 'px';
      }
      function onUp(ev){
        resize.releasePointerCapture(e.pointerId);
        resize.removeEventListener('pointermove', onMove);
        resize.removeEventListener('pointerup', onUp);
        saveWinState(win);
      }
      resize.addEventListener('pointermove', onMove);
      resize.addEventListener('pointerup', onUp);
    });

    if (body) body.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  }

  // ---- pan (arrastar o fundo com botão direito ou do meio) e zoom (scroll) ----
  var panning = false, panStart = null, panOrig = null, panButton = -1;
  var suppressCtx = false;

  // mouse: só botão do meio (1) ou direito (2); toque/caneta: qualquer arrasto no fundo
  function isPanStart(e){
    return e.pointerType === 'mouse' ? (e.button === 1 || e.button === 2) : true;
  }

  // no fundo vazio, o mousedown não pode iniciar seleção de texto nas janelas
  // nem o autoscroll do botão do meio
  viewport.addEventListener('mousedown', function(e){
    if (e.target !== viewport) return;
    e.preventDefault();
    var a = document.activeElement;
    if (a && a !== document.body && a.blur) a.blur();
  });

  viewport.addEventListener('pointerdown', function(e){
    if (e.target !== viewport) return;
    if (!isPanStart(e)) return;
    panning = true;
    panButton = e.button;
    if (e.pointerType === 'mouse' && e.button === 2) suppressCtx = true;
    viewport.classList.add('panning');
    panStart = {x:e.clientX, y:e.clientY};
    panOrig = {x:pan.x, y:pan.y};
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', function(e){
    if (!panning) return;
    pan.x = panOrig.x + (e.clientX - panStart.x) / zoom;
    pan.y = panOrig.y + (e.clientY - panStart.y) / zoom;
    applyTransform();
  });
  function endPan(e){
    if (!panning) return;
    if (e.type === 'pointerup' && e.pointerType === 'mouse' && e.button !== panButton) return;
    panning = false;
    viewport.classList.remove('panning');
    // o menu de contexto pode disparar logo após soltar o botão direito
    setTimeout(function(){ suppressCtx = false; }, 50);
  }
  viewport.addEventListener('pointerup', endPan);
  viewport.addEventListener('pointercancel', endPan);

  // sem menu de contexto no fundo vazio (nem ao terminar um pan com o botão direito);
  // dentro das janelas o menu normal continua disponível
  viewport.addEventListener('contextmenu', function(e){
    if (e.target === viewport || suppressCtx) e.preventDefault();
  });

  function zoomBy(factor, sx, sy){
    var before = screenToCanvas(sx, sy);
    zoom = Math.min(4, Math.max(0.2, zoom * factor));
    var after = screenToCanvas(sx, sy);
    pan.x += (after.x - before.x);
    pan.y += (after.y - before.y);
    applyTransform();
  }

  // ---- aliases simples pra quem for implementar manualmente por cima do Canvas Infinito ----
  function setZoom(level){
    if (typeof level !== 'number' || !isFinite(level)){
      console.warn('setZoom: informe um número (ex.: setZoom(1) para 100%).');
      return;
    }
    zoom = Math.min(4, Math.max(0.2, level));
    applyTransform();
  }
  function setPan(x, y){
    if (typeof x !== 'number' || typeof y !== 'number'){
      console.warn('setPan: informe dois números, x e y, em coordenadas do canvas.');
      return;
    }
    pan.x = x; pan.y = y;
    applyTransform();
  }
  window.setZoom = setZoom; // pode ser chamado pelo console do navegador também
  window.setPan = setPan;

  viewport.addEventListener('wheel', function(e){
    // sobre uma janela, o scroll pertence ao conteúdo dela: sem zoom do canvas
    if (e.target.closest && e.target.closest('.win')) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.014 : 1 / 1.014, e.clientX, e.clientY);
  }, {passive:false});

  // ---- botões e console de comando ----
  document.getElementById('btnZoomIn').addEventListener('click', function(){
    zoomBy(1.2, viewport.clientWidth/2, viewport.clientHeight/2);
  });
  document.getElementById('btnZoomOut').addEventListener('click', function(){
    zoomBy(1/1.2, viewport.clientWidth/2, viewport.clientHeight/2);
  });
  document.getElementById('btnReset').addEventListener('click', function(){
    pan = {x:0,y:0}; zoom = 1; applyTransform();
  });

  // ---- posição do bloco de controles (zoom/lupa/tela cheia/centralizar + painel de busca) ----
  function centerControls(){ document.body.classList.add('controls-centered'); }
  function bottomControls(){ document.body.classList.remove('controls-centered'); }
  window.centerControls = centerControls; // pode ser chamado pelo console do navegador também
  window.bottomControls = bottomControls;

  // ---- fundo transparente (útil para embutir o Canvas Infinito sobre outra interface) ----
  function setTransparentBackground(){ document.body.classList.add('bg-transparent'); }
  function setOpaqueBackground(){ document.body.classList.remove('bg-transparent'); }
  window.setTransparentBackground = setTransparentBackground; // pode ser chamado pelo console do navegador também
  window.setOpaqueBackground = setOpaqueBackground;

  // ---- buscar / localizar janela ----
  var btnSearch = document.getElementById('btnSearch');
  var searchPanel = document.getElementById('searchPanel');
  var searchInput = document.getElementById('searchInput');
  var searchList = document.getElementById('searchList');

  function panToWindow(win){
    var cx = parseFloat(win.style.left) + win.offsetWidth / 2;
    var cy = parseFloat(win.style.top) + win.offsetHeight / 2;
    pan.x = viewport.clientWidth / (2 * zoom) - cx;
    pan.y = viewport.clientHeight / (2 * zoom) - cy;
    applyTransform();
    if (!win.classList.contains('maximized')) bringToFront(win);
  }

  // ---- centralizar uma janela por programação, igual ao clique na lista da lupa ----
  function center(titulo){
    var win = findWindowByName(titulo);
    if (!win){
      console.warn('center: janela "' + titulo + '" não encontrada.');
      return null;
    }
    panToWindow(win);
    return win;
  }
  window.center = center; // pode ser chamado pelo console do navegador também

  function renderSearchList(filter){
    var q = (filter || '').trim().toLowerCase();
    searchList.innerHTML = '';
    var matches = windows.filter(function(w){ return w.dataset.name.toLowerCase().indexOf(q) !== -1; });
    if (matches.length === 0){
      var empty = document.createElement('div');
      empty.id = 'searchEmpty';
      empty.textContent = 'Nenhuma janela encontrada.';
      searchList.appendChild(empty);
      return;
    }
    matches.forEach(function(w){
      var btn = document.createElement('button');
      btn.textContent = w.dataset.name;
      btn.addEventListener('click', function(){ panToWindow(w); closeSearch(); });
      searchList.appendChild(btn);
    });
  }
  function openSearch(){
    searchPanel.classList.add('open');
    searchInput.value = '';
    renderSearchList('');
    searchInput.focus();
  }
  function closeSearch(){ searchPanel.classList.remove('open'); }

  btnSearch.addEventListener('click', function(e){
    e.stopPropagation();

  searchInput.addEventListener('input', function(){ renderSearchList(searchInput.value); });
  searchInput.addEventListener('keydown', function(e){
    e.stopPropagation();
    if (e.key === 'Escape') closeSearch();
  });
  document.addEventListener('pointerdown', function(e){
    if (!searchPanel.classList.contains('open')) return;
    if (searchPanel.contains(e.target) || btnSearch.contains(e.target)) return;
    closeSearch();
  });

  // ---- tela cheia do documento ----
  var btnFullscreen = document.getElementById('btnFullscreen');
  var ICON_ENTER_FS = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>';
  var ICON_EXIT_FS  = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>';
  function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function updateFsButton(){
    var on = !!fsElement();
    btnFullscreen.innerHTML = on ? ICON_EXIT_FS : ICON_ENTER_FS;
    btnFullscreen.title = on ? 'Sair da tela cheia' : 'Tela cheia';
  }
  btnFullscreen.addEventListener('click', function(){
    try {
      var p;
      if (fsElement()){
        p = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var el = document.documentElement;
        p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      }
      if (p && p.catch) p.catch(function(err){ console.warn('Tela cheia indisponível:', err.message); });
    } catch (err){
      console.warn('Tela cheia indisponível:', err.message);
    }
  });
  document.addEventListener('fullscreenchange', updateFsButton);
  document.addEventListener('webkitfullscreenchange', updateFsButton);
  updateFsButton();

  // ---- digitar em qualquer lugar (fora de janelas) foca a barra de comando ----
  var lastMouse = {x:-1, y:-1};
  document.addEventListener('mousemove', function(e){
    lastMouse.x = e.clientX; lastMouse.y = e.clientY;
  }, {passive:true});

  function isTypingTriggerKey(e){
    if (e.key === 'Enter' || e.key === ' ') return true;
    return e.key.length === 1 && /[a-zA-ZÀ-ÿ]/.test(e.key);
  }
  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var ae = document.activeElement;
    if (ae === cmdInput || ae === searchInput) return; // já digitando ali, comportamento nativo cuida disso
    if (ae && ae.closest && ae.closest('.win')) return; // já editando dentro de uma janela
    if (!isTypingTriggerKey(e)) return;
    var hoverEl = document.elementFromPoint(lastMouse.x, lastMouse.y);
    if (hoverEl && hoverEl.closest && hoverEl.closest('.win')) return; // mouse sobre uma janela: não rouba o foco
    cmdInput.focus();
  });

  function runCommand(raw){
    var cmd = raw.trim();
    if (!cmd) return;
    consoleBar.classList.add('used'); // a partir do 1º comando, ela vira transparente quando ociosa
    try {
      // executa a instrução como JavaScript de verdade, com acesso às funções do canvas
      (new Function('newwindow', 'newframe', 'run', 'newpermawindow', 'newpermaframe', 'permarun',
                    'connect', 'disconnect', 'setTheme', 'setTempTheme', 'help',
                    'centerControls', 'bottomControls', 'setTransparentBackground', 'setOpaqueBackground',
                    'polaroid', 'newdoc', 'newidoc', 'rundoc', 'newpermadoc', 'newpermaidoc', 'runpermadoc',
                    'setZoom', 'setPan', 'center', 'multicolor', 'singlecolor', 'svg',
                    'newsdoc', 'newsidoc', 'runsdoc', 'newpermasdoc', 'newpermasidoc', 'runpermasdoc',
                    'groovy', 'ungroovy',
                    cmd))(
        newwindow, newframe, run, newpermawindow, newpermaframe, permarun,
        connect, disconnect, setTheme, setTempTheme, help,
        centerControls, bottomControls, setTransparentBackground, setOpaqueBackground,
        polaroid, newdoc, newidoc, rundoc, newpermadoc, newpermaidoc, runpermadoc,
        setZoom, setPan, center, multicolor, singlecolor, svg,
        newsdoc, newsidoc, runsdoc, newpermasdoc, newpermasidoc, runpermasdoc,
        groovy, ungroovy);
    } catch (err){
      console.warn('Comando inválido:', err.message);
    }
  }
  cmdInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ runCommand(cmdInput.value); cmdInput.value = ''; }
  });

  applyTransform();

  // tema inicial: o registrado no localStorage, ou "auto"
  (function(){
    var saved = null;
    try { saved = localStorage.getItem(THEME_STORAGE_KEY); } catch(e){}
    applyTheme(saved || 'auto');
  })();
})();
