<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Canvas Infinito</title>
    <style>
      :root {
        --bg: #f4f4f6;
        --panel: #ffffff;
        --panel-border: #d8d8de;
        --text: #1c1c22;
        --muted: #6b6b76;
        --accent: #4f6df5;
        --accent-text: #ffffff;
        --win-header: #eceef4;
        --win-bg: #ffffff;
        --win-border: #c9cbd6;
        --shadow: rgba(0, 0, 0, 0.15);
        --grid-dot: #c7c7d1;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #16171d;
          --panel: #202129;
          --panel-border: #33343e;
          --text: #eceef2;
          --muted: #9a9aa6;
          --accent: #7c93ff;
          --accent-text: #0e0f14;
          --win-header: #262832;
          --win-bg: #1c1d24;
          --win-border: #3a3c48;
          --shadow: rgba(0, 0, 0, 0.5);
          --grid-dot: #33343e;
        }
      }
      :root[data-theme="dark"] {
        --bg: #16171d;
        --panel: #202129;
        --panel-border: #33343e;
        --text: #eceef2;
        --muted: #9a9aa6;
        --accent: #7c93ff;
        --accent-text: #0e0f14;
        --win-header: #262832;
        --win-bg: #1c1d24;
        --win-border: #3a3c48;
        --shadow: rgba(0, 0, 0, 0.5);
        --grid-dot: #33343e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        overflow: hidden;
      }
      #viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        background-image: radial-gradient(
          var(--grid-dot) 1.4px,
          transparent 1.4px
        );
        cursor: default;
      }
      #viewport.panning {
        cursor: grabbing;
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        transform-origin: 0 0;
      }
      .win {
        position: absolute;
        min-width: 150px;
        min-height: 110px;
        background: var(--win-bg);
        border: 1px solid var(--win-border);
        border-radius: 10px;
        box-shadow: 0 8px 24px var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }
      .win-header {
        background: var(--win-header);
        padding: 8px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: grab;
        border-bottom: 1px solid var(--win-border);
        font-size: 13px;
        font-weight: 600;
        touch-action: none;
      }
      .win-header:active {
        cursor: grabbing;
      }
      .win-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        pointer-events: none;
      }
      .win-header-btns {
        display: flex;
        align-items: center;
        flex: none;
        gap: 4px;
      }
      .win-max,
      .win-close {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        flex: none;
      }
      .win-max:hover,
      .win-close:hover {
        background: var(--panel-border);
        color: var(--text);
      }
      .win.maximized {
        border-radius: 0;
      }
      .win.maximized .win-resize {
        display: none;
      }
      .win-body {
        flex: 1;
        padding: 10px;
        overflow: auto;
        outline: none;
        font-size: 14px;
        user-select: text;
        color: var(--text);
      }
      .win-body.no-padding {
        padding: 0;
      }
      .win-body.doc {
        font-size: 13px;
        line-height: 1.5;
      }
      .doc h4 {
        margin: 14px 0 4px;
        font-size: 13px;
      }
      .doc h4:first-child {
        margin-top: 0;
      }
      .doc p {
        margin: 4px 0;
      }
      .doc ul {
        margin: 4px 0;
        padding-left: 18px;
      }
      .doc code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        background: var(--win-header);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .doc .sig {
        display: block;
        padding: 6px 8px;
        margin: 4px 0;
        color: var(--accent);
      }
      .doc hr {
        border: none;
        border-top: 1px solid var(--win-border);
        margin: 12px 0;
      }
      .win-resize {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 18px;
        height: 18px;
        cursor: nwse-resize;
        touch-action: none;
        background: linear-gradient(
          135deg,
          transparent 50%,
          var(--win-border) 50%
        );
      }
      #console {
        position: fixed;
        left: 12px;
        right: 64px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 9999;
        max-width: 520px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 8px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
      #console .prompt {
        color: var(--accent);
        flex: none;
      }
      #cmdInput {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
      }
      #hint {
        color: var(--muted);
        font-size: 11px;
        flex: none;
      }
      #viewControls {
        position: fixed;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 5px;
      }
      #viewControls button {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #viewControls button:hover {
        background: var(--panel-border);
      }
      #zoomLabel {
        font-size: 11px;
        color: var(--muted);
        padding: 2px 0;
        text-align: center;
      }
      #viewControls hr {
        width: 100%;
        border: none;
        border-top: 1px solid var(--panel-border);
        margin: 3px 0;
      }
      .link {
        stroke: var(--accent);
        stroke-width: 2;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="viewport">
      <div id="canvas">
        <svg
          id="linksLayer"
          width="1"
          height="1"
          style="
            position: absolute;
            top: 0;
            left: 0;
            overflow: visible;
            pointer-events: none;
          "
        ></svg>
      </div>
    </div>

    <div id="console">
      <span class="prompt">&gt;</span>
      <input
        id="cmdInput"
        placeholder="digite help() para ver todos os comandos"
        autocomplete="off"
      />
      <span id="hint">Enter</span>
    </div>

    <div id="viewControls">
      <button id="btnZoomIn" title="Aumentar zoom">+</button>
      <span id="zoomLabel">100%</span>
      <button id="btnZoomOut" title="Diminuir zoom">−</button>
      <hr />
      <button id="btnReset" title="Centralizar">⌖</button>
      <button id="btnFullscreen" title="Tela cheia"></button>
    </div>

    <script>
      (function () {
        var viewport = document.getElementById("viewport");
        var canvas = document.getElementById("canvas");
        var linksLayer = document.getElementById("linksLayer");
        var zoomLabel = document.getElementById("zoomLabel");
        var cmdInput = document.getElementById("cmdInput");
        var consoleBar = document.getElementById("console");
        var viewControls = document.getElementById("viewControls");
        var maximizedCount = 0;
        function updateUIVisibility() {
          var hide = maximizedCount > 0;
          consoleBar.style.display = hide ? "none" : "";
          viewControls.style.display = hide ? "none" : "";
        }

        var pan = { x: 0, y: 0 };
        var zoom = 1;
        var zTop = 1;
        var windows = [];
        var links = [];
        var idSeq = 1;

        function applyTransform() {
          canvas.style.transform =
            "scale(" + zoom + ") translate(" + pan.x + "px, " + pan.y + "px)";
          var grid = 32 * zoom;
          viewport.style.backgroundSize = grid + "px " + grid + "px";
          viewport.style.backgroundPosition =
            pan.x * zoom + "px " + pan.y * zoom + "px";
          zoomLabel.textContent = Math.round(zoom * 100) + "%";
        }

        function screenToCanvas(sx, sy) {
          var r = viewport.getBoundingClientRect();
          return {
            x: (sx - r.left) / zoom - pan.x,
            y: (sy - r.top) / zoom - pan.y,
          };
        }

        // ---- temas de cor ----
        var THEME_VARS = [
          "bg",
          "panel",
          "panel-border",
          "text",
          "muted",
          "accent",
          "accent-text",
          "win-header",
          "win-bg",
          "win-border",
          "shadow",
          "grid-dot",
        ];
        var THEMES = {
          dracula: {
            bg: "#282a36",
            panel: "#21222c",
            "panel-border": "#44475a",
            text: "#f8f8f2",
            muted: "#6272a4",
            accent: "#bd93f9",
            "accent-text": "#282a36",
            "win-header": "#343646",
            "win-bg": "#282a36",
            "win-border": "#44475a",
            shadow: "rgba(0,0,0,.5)",
            "grid-dot": "#44475a",
          },
          nord: {
            bg: "#2e3440",
            panel: "#3b4252",
            "panel-border": "#4c566a",
            text: "#eceff4",
            muted: "#81a1c1",
            accent: "#88c0d0",
            "accent-text": "#2e3440",
            "win-header": "#434c5e",
            "win-bg": "#2e3440",
            "win-border": "#4c566a",
            shadow: "rgba(0,0,0,.5)",
            "grid-dot": "#434c5e",
          },
          "solarized-dark": {
            bg: "#002b36",
            panel: "#073642",
            "panel-border": "#586e75",
            text: "#93a1a1",
            muted: "#657b83",
            accent: "#268bd2",
            "accent-text": "#002b36",
            "win-header": "#073642",
            "win-bg": "#002b36",
            "win-border": "#586e75",
            shadow: "rgba(0,0,0,.5)",
            "grid-dot": "#073642",
          },
          "solarized-light": {
            bg: "#fdf6e3",
            panel: "#eee8d5",
            "panel-border": "#93a1a1",
            text: "#586e75",
            muted: "#93a1a1",
            accent: "#268bd2",
            "accent-text": "#fdf6e3",
            "win-header": "#eee8d5",
            "win-bg": "#fdf6e3",
            "win-border": "#93a1a1",
            shadow: "rgba(0,0,0,.15)",
            "grid-dot": "#eee8d5",
          },
          monokai: {
            bg: "#272822",
            panel: "#2d2e27",
            "panel-border": "#49483e",
            text: "#f8f8f2",
            muted: "#75715e",
            accent: "#66d9ef",
            "accent-text": "#272822",
            "win-header": "#3e3d32",
            "win-bg": "#272822",
            "win-border": "#49483e",
            shadow: "rgba(0,0,0,.5)",
            "grid-dot": "#49483e",
          },
          "one-dark": {
            bg: "#282c34",
            panel: "#2c313a",
            "panel-border": "#3e4451",
            text: "#abb2bf",
            muted: "#5c6370",
            accent: "#61afef",
            "accent-text": "#282c34",
            "win-header": "#333842",
            "win-bg": "#282c34",
            "win-border": "#3e4451",
            shadow: "rgba(0,0,0,.5)",
            "grid-dot": "#3e4451",
          },
          "gruvbox-dark": {
            bg: "#282828",
            panel: "#32302f",
            "panel-border": "#504945",
            text: "#ebdbb2",
            muted: "#928374",
            accent: "#83a598",
            "accent-text": "#282828",
            "win-header": "#3c3836",
            "win-bg": "#282828",
            "win-border": "#504945",
            shadow: "rgba(0,0,0,.5)",
            "grid-dot": "#3c3836",
          },
          "github-dark": {
            bg: "#0d1117",
            panel: "#161b22",
            "panel-border": "#30363d",
            text: "#c9d1d9",
            muted: "#8b949e",
            accent: "#58a6ff",
            "accent-text": "#0d1117",
            "win-header": "#161b22",
            "win-bg": "#0d1117",
            "win-border": "#30363d",
            shadow: "rgba(0,0,0,.5)",
            "grid-dot": "#21262d",
          },
        };
        function clearThemeOverrides() {
          THEME_VARS.forEach(function (v) {
            document.documentElement.style.removeProperty("--" + v);
          });
        }
        // aplica o tema visualmente; retorna true se o tema é válido
        function applyTheme(name) {
          var key = String(name || "")
            .trim()
            .toLowerCase();
          if (key === "auto" || key === "system") {
            document.documentElement.removeAttribute("data-theme");
            clearThemeOverrides();
            return "auto";
          }
          if (key === "light" || key === "dark") {
            clearThemeOverrides();
            document.documentElement.setAttribute("data-theme", key);
            return key;
          }
          var t = THEMES[key];
          if (!t) {
            console.warn(
              'Tema desconhecido: "' +
                name +
                '". Disponíveis: light, dark, auto, ' +
                Object.keys(THEMES).join(", "),
            );
            return null;
          }
          document.documentElement.setAttribute("data-theme", key);
          THEME_VARS.forEach(function (v) {
            document.documentElement.style.setProperty("--" + v, t[v]);
          });
          return key;
        }
        var THEME_STORAGE_KEY = "infcanvas:theme";
        // aplica e registra no localStorage (persiste entre sessões)
        function setTheme(name) {
          var applied = applyTheme(name);
          if (applied) {
            try {
              localStorage.setItem(THEME_STORAGE_KEY, applied);
            } catch (e) {
              /* storage indisponível */
            }
          }
        }
        // aplica sem registrar no localStorage
        function setTempTheme(name) {
          applyTheme(name);
        }
        window.setTheme = setTheme; // pode ser chamado pelo console do navegador também
        window.setTempTheme = setTempTheme;

        // ---- persistência de posição/tamanho por nome (localStorage) ----
        function storageKey(name) {
          return "infcanvas:" + String(name).trim().toLowerCase();
        }
        function saveWinState(win) {
          try {
            var rec = {
              left: parseFloat(win.style.left),
              top: parseFloat(win.style.top),
              width: parseFloat(win.style.width),
              height: parseFloat(win.style.height),
            };
            localStorage.setItem(
              storageKey(win.dataset.name),
              JSON.stringify(rec),
            );
          } catch (e) {
            /* storage indisponível: segue sem persistir */
          }
        }
        function loadWinState(name) {
          try {
            var raw = localStorage.getItem(storageKey(name));
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        }

        // ---- criação de janelas ----
        function resolvePosition(name, x, y, w, h, id) {
          var center = screenToCanvas(
            viewport.clientWidth / 2,
            viewport.clientHeight / 2,
          );
          var noPosArgs =
            x === undefined &&
            y === undefined &&
            w === undefined &&
            h === undefined;
          var saved = noPosArgs ? loadWinState(name) : null;
          if (saved) return saved;
          return {
            left: typeof x === "number" ? x : center.x - 130 + (id % 5) * 20,
            top: typeof y === "number" ? y : center.y - 90 + (id % 5) * 20,
            width: typeof w === "number" ? w : 260,
            height: typeof h === "number" ? h : 180,
          };
        }

        function createWindowShell(name, pos, bodyHtml, permanent) {
          var win = document.createElement("div");
          win.className = "win";
          win.dataset.name = name;
          win.style.left = pos.left + "px";
          win.style.top = pos.top + "px";
          win.style.width = pos.width + "px";
          win.style.height = pos.height + "px";
          win.style.zIndex = ++zTop;

          win.innerHTML =
            '<div class="win-header">' +
            '<span class="win-title">' +
            name +
            "</span>" +
            '<span class="win-header-btns">' +
            '<button class="win-max" title="Maximizar">⤢</button>' +
            (permanent
              ? ""
              : '<button class="win-close" title="Fechar">✕</button>') +
            "</span>" +
            "</div>" +
            bodyHtml +
            '<div class="win-resize"></div>';

          canvas.appendChild(win);
          windows.push(win);
          wireWindow(win);
          return win;
        }

        function makeWindow(permanent, title, x, y, w, h) {
          var id = idSeq++;
          var name = title || "Janela " + id;
          var pos = resolvePosition(name, x, y, w, h, id);
          var bodyHtml =
            '<div class="win-body" contenteditable="true" spellcheck="false">Escreva aqui…</div>';
          return createWindowShell(name, pos, bodyHtml, permanent);
        }
        function newwindow(title, x, y, w, h) {
          return makeWindow(false, title, x, y, w, h);
        }
        function newpermawindow(title, x, y, w, h) {
          return makeWindow(true, title, x, y, w, h);
        }
        window.newwindow = newwindow; // pode ser chamado pelo console do navegador também
        window.newpermawindow = newpermawindow;

        // ---- janela com iframe ----
        function makeFrame(permanent, url, title, x, y, w, h) {
          var id = idSeq++;
          var name = title || url || "Frame " + id;
          var pos = resolvePosition(name, x, y, w, h, id);
          var safeUrl = String(url || "").replace(/"/g, "&quot;");
          var bodyHtml =
            '<div class="win-body no-padding">' +
            '<iframe src="' +
            safeUrl +
            '" style="width:100%;height:100%;border:none;display:block;"></iframe>' +
            "</div>";
          return createWindowShell(name, pos, bodyHtml, permanent);
        }
        function newframe(url, title, x, y, w, h) {
          return makeFrame(false, url, title, x, y, w, h);
        }
        function newpermaframe(url, title, x, y, w, h) {
          return makeFrame(true, url, title, x, y, w, h);
        }
        window.newframe = newframe; // pode ser chamado pelo console do navegador também
        window.newpermaframe = newpermaframe;

        // ---- janela que executa uma função JS definida pelo usuário ----
        function makeRun(permanent, title, fnName, params, x, y, w, h) {
          var id = idSeq++;
          var name = title || "Run " + id;
          var pos = resolvePosition(name, x, y, w, h, id);
          var domId = "newrun" + id;
          var bodyHtml =
            '<div class="win-body no-padding" id="' + domId + '"></div>';
          var win = createWindowShell(name, pos, bodyHtml, permanent);
          var fn = window[fnName];
          if (typeof fn !== "function") {
            console.warn(
              'run: função "' +
                fnName +
                '" não encontrada em window. Defina-a (window.' +
                fnName +
                " = function(id, params){...}) antes de chamar run().",
            );
          } else {
            try {
              fn(domId, params);
            } catch (err) {
              console.warn(
                'run: erro ao executar "' + fnName + '":',
                err.message,
              );
            }
          }
          return win;
        }
        function run(title, fnName, params, x, y, w, h) {
          return makeRun(false, title, fnName, params, x, y, w, h);
        }
        function permarun(title, fnName, params, x, y, w, h) {
          return makeRun(true, title, fnName, params, x, y, w, h);
        }
        window.run = run; // pode ser chamado pelo console do navegador também
        window.permarun = permarun;

        // ---- ajuda ----
        var HELP_HTML = `
<h4>Como usar</h4>
<p>Digite uma instrução JavaScript na barra de comando e pressione Enter. As funções abaixo também podem ser chamadas pelo console do navegador (DevTools). Para navegar, arraste o fundo vazio com o botão direito ou o do meio do mouse. O scroll dá zoom apenas quando o mouse está sobre o fundo, não sobre uma janela.</p>
<p>Posição e tamanho são em pixels do canvas. <code>x</code>, <code>y</code>, <code>w</code>, <code>h</code> são sempre opcionais. Se uma janela é criada só com um nome já registrado (sem x, y, w, h), ela reabre na posição e no tamanho em que foi deixada. Coordenadas explícitas têm prioridade sobre o registro.</p>
<hr>
<h4>Janelas</h4>
<code class="sig">newwindow(título, x, y, w, h)</code>
<p>Janela de texto editável, com padding. Sem título, usa "Janela N".</p>
<code class="sig">newpermawindow(título, x, y, w, h)</code>
<p>Igual à <code>newwindow</code>, mas sem botão de fechar (permanente no canvas).</p>
<code class="sig">newframe(url, título, x, y, w, h)</code>
<p>Janela com um iframe ocupando todo o espaço, sem padding. Sem título, usa a url. Muitos sites bloqueiam exibição em iframe.</p>
<code class="sig">newpermaframe(url, título, x, y, w, h)</code>
<p>Igual à <code>newframe</code>, mas sem botão de fechar.</p>
<code class="sig">run(título, nomeDaFuncao, params, x, y, w, h)</code>
<p>Cria uma janela sem padding, cujo corpo recebe um id gerado (<code>newrun1</code>, <code>newrun2</code>...) e executa <code>window[nomeDaFuncao](id, params)</code>. O primeiro argumento da sua função é sempre a string com o id; o segundo é o valor de <code>params</code>. A função precisa existir em <code>window</code> (ex.: <code>window.minhaFuncao = function(id, params){...}</code>).</p>
<p>Exemplo: <code>run("Label", "minhaFuncao", {a: 1}, 300, 200, 600, 400)</code></p>
<code class="sig">permarun(título, nomeDaFuncao, params, x, y, w, h)</code>
<p>Igual à <code>run</code>, mas sem botão de fechar.</p>
<hr>
<h4>Conexões</h4>
<code class="sig">connect(nomeA, nomeB)</code>

<code class="sig">disconnect(nomeA, nomeB)</code>
<p>Remove a linha entre as duas janelas, em qualquer ordem.</p>
<hr>
<h4>Temas</h4>
<code class="sig">setTheme(nome)</code>
<p>Aplica o tema e registra no localStorage; ele será usado nas próximas vezes que a ferramenta abrir.</p>
<code class="sig">setTempTheme(nome)</code>

          wrap: true,
          fontSize: "14px",
          fontFamily: "Fira Code",
          fadeFoldWidgets: true,
        };

        thisace.setOptions(acegeneralconfig);

        // Create a new ResizeObserver instance
        let codeObserver = new ResizeObserver((entries) => {
          for (const entry of entries) {
            console.log("rodou o observer..." + entry.target.id);
            ace.edit("editor_" + entry.target.id).resize();
          }
        });

        codeObserver.observe(document.getElementById(id));

        thisace.getSession().on("change", function () {
          codex[id] = thisace.getSession().getValue();
        });
      };
    </script>
