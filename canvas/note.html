<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notebook</title>

    <style>
      :root {
        --text: #242424;
        --muted: #8a8a8a;
        --line: #e8e8e8;
        --hover: #f4f4f4;
        --code: #f8f8f7;
        --accent: #4b72d8;
        --error: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: white;
        color: var(--text);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 15px;
      }

      #document {
        width: min(900px, calc(100vw - 48px));
        margin: 70px auto 160px;
      }

      .cell {
        position: relative;
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        min-height: 38px;
      }

      .gutter {
        position: relative;
        user-select: none;
        cursor: grab;
      }

      .gutter:active {
        cursor: grabbing;
      }

      .gutter::before {
        content: "";
        position: absolute;
        left: 12px;
        top: 12px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: transparent;
        box-shadow:
          0 6px 0 transparent,
          0 12px 0 transparent,
          5px 0 0 transparent,
          5px 6px 0 transparent,
          5px 12px 0 transparent;
      }

      .cell:hover .gutter::before {
        background: #b8b8b8;
        box-shadow:
          0 6px 0 #b8b8b8,
          0 12px 0 #b8b8b8,
          5px 0 0 #b8b8b8,
          5px 6px 0 #b8b8b8,
          5px 12px 0 #b8b8b8;
      }

      .cell-content {
        min-width: 0;
        padding: 0 0 14px;
      }

      .cell-type {
        position: absolute;
        left: 36px;
        top: -4px;
        z-index: 4;
        display: none;
        font-size: 10px;
        color: #888;
        background: white;
        padding: 2px 5px;
        border: 1px solid #e5e5e5;
        border-radius: 4px;
        pointer-events: none;
      }

      .cell:hover .cell-type,
      .cell:focus-within .cell-type {
        display: block;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 38px;
        padding: 7px 0;
        margin: 0;
        border: 0;
        outline: none;
        resize: none;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font: inherit;
        line-height: 1.55;
      }

      .code-editor {
        position: relative;
        border-radius: 5px;
        overflow: hidden;
        background: var(--code);
      }

      .code-editor pre,
      .code-editor textarea {
        margin: 0;
        padding: 9px 13px;
        width: 100%;
        min-height: 38px;
        border: 0;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.55;
        tab-size: 2;
        white-space: pre-wrap;
        overflow: auto;
        word-break: normal;
      }

      .code-editor pre {
        position: relative;
        z-index: 1;
        pointer-events: none;
        min-height: 100%;
        color: #242424;
      }

      .code-editor pre code {
        font: inherit;
        white-space: inherit;
        word-break: inherit;
      }

      .code-editor textarea {
        position: absolute;
        z-index: 2;
        inset: 0;
        height: 100%;
        resize: none;
        outline: none;
        background: transparent;
        color: transparent;
        -webkit-text-fill-color: transparent;
        caret-color: var(--text);
        overflow: hidden;
      }

      .code-editor textarea::selection {
        background: rgba(75, 114, 216, 0.25);
        -webkit-text-fill-color: transparent;
      }

      .code-editor:focus-within {
        box-shadow: inset 0 0 0 1px #e2e2e2;
      }

      .output {
        margin: 0 0 6px;
        padding: 0 13px 10px;
        border-left: 2px solid #ececec;
        color: #303030;
      }

      .output:empty {
        display: none;
      }

      .output-item {
        padding: 4px 0;
        overflow: auto;
      }

      .output-item + .output-item {
        border-top: 1px solid var(--line);
      }

      .output pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      .output .text {
        white-space: pre-wrap;
      }

      .output table {
        border-collapse: collapse;
        font-size: 13px;
      }

      .output th,
      .output td {
        border: 1px solid #ddd;
        padding: 4px 8px;
        text-align: left;
      }

      .error {
        color: var(--error);
        white-space: pre-wrap;
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }

      .empty-cell {
        min-height: 44px;
      }

      .empty-cell textarea {
        color: transparent;
        caret-color: var(--text);
      }

      .empty-cell textarea:focus {
        background: #fafafa;
        border-radius: 5px;
      }

      .dragging {
        opacity: 0.35;
      }

      .drag-over {
        position: relative;
      }

      .drag-over::before {
        content: "";
        position: absolute;
        left: 36px;
        right: 0;
        top: -4px;
        height: 2px;
        background: var(--accent);
        border-radius: 2px;
        z-index: 5;
      }

      .cell-tools {
        position: absolute;
        right: 4px;
        top: 4px;
        display: none;
        gap: 3px;
        z-index: 3;
      }

      .cell:hover .cell-tools,
      .cell:focus-within .cell-tools {
        display: flex;
      }

      .tool {
        border: 0;
        background: white;
        color: #888;
        border-radius: 4px;
        width: 25px;
        height: 25px;
        cursor: pointer;
        font-size: 13px;
      }

      .tool:hover {
        background: var(--hover);
        color: #333;
      }

      /* Menu contextual do gutter */
      #context-menu {
        position: fixed;
        z-index: 1000;
        display: none;
        min-width: 190px;
        padding: 5px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.14);
      }

      #context-menu.open {
        display: block;
      }

      .menu-title {
        padding: 6px 9px 5px;
        color: #999;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 7px 9px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
        color: #333;
        text-align: left;
        font: 13px inherit;
      }

      .menu-item:hover {
        background: #f3f4f6;
      }

      .menu-item.active {
        background: #edf2ff;
        color: #315cc2;
      }

      .menu-icon {
        width: 20px;
        color: #777;
        font:
          11px ui-monospace,
          monospace;
      }

      @media (max-width: 600px) {
        #document {
          width: calc(100vw - 24px);
          margin-top: 35px;
        }

        .cell {
          grid-template-columns: 28px minmax(0, 1fr);
        }
        .gutter::before {
          left: 7px;
        }
        .drag-over::before {
          left: 28px;
        }
        .cell-type {
          left: 28px;
        }
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github.min.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"></script>

    <!-- Markdown -> HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- TypeScript -> JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/typescript@5.9.2/lib/typescript.min.js"></script>

    <!-- p5.js -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  </head>

  <body>
    <main id="document"></main>

    <div id="context-menu">
      <div class="menu-title">Tipo da célula</div>
      <button class="menu-item" data-type="javascript">
        <span class="menu-icon">JS</span> JavaScript
      </button>
      <button class="menu-item" data-type="typescript">
        <span class="menu-icon">TS</span> TypeScript
      </button>
      <button class="menu-item" data-type="p5">
        <span class="menu-icon">p5</span> P5.js
      </button>
      <button class="menu-item" data-type="html">
        <span class="menu-icon">&lt;/&gt;</span> HTML
      </button>
      <button class="menu-item" data-type="markdown">
        <span class="menu-icon">MD</span> Markdown
      </button>
    </div>

    <script>
      (() => {
        "use strict";

        const root = document.querySelector("#document");
        const contextMenu = document.querySelector("#context-menu");

        const cells = [];
        let nextId = 1;
        let draggedId = null;
        let activeCellId = null;
        let contextCellId = null;

        function createCell(code = "", type = "javascript") {
          return {
            id: "cell-" + nextId++,
            code,
            type,
            output: [],
          };
        }

        cells.push(
          createCell(
            `const numeros = [1, 2, 3, 4, 5];

display(numeros);`,
            "javascript",
          ),
        );

        cells.push(
          createCell(
            `const quadrados = numeros.map(n => n * n);

display(quadrados);`,
            "javascript",
          ),
        );

        cells.push(createCell("", "javascript"));

        function isLastCell(cell) {
          return cells[cells.length - 1] === cell;
        }

        function ensureTrailingEmptyCell() {
          if (!cells.length || cells[cells.length - 1].code.trim() !== "") {
            cells.push(createCell(""));
          }

          while (
            cells.length > 1 &&
            cells[cells.length - 1].code.trim() === "" &&
            cells[cells.length - 2].code.trim() === ""
          ) {
            cells.splice(cells.length - 2, 1);
          }
        }

        function resizeTextarea(ta) {
          ta.style.height = "auto";
          ta.style.height = Math.max(38, ta.scrollHeight) + "px";
        }

        function escapeHtml(value) {
          return String(value).replace(
            /[&<>"']/g,
            (char) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[char],
          );
        }

        function renderValue(value) {
          if (value instanceof Error) {
            return `<div class="error">${escapeHtml(value.stack || value.message)}</div>`;
          }

          if (value instanceof Node) {
            const wrapper = document.createElement("div");
            wrapper.appendChild(value.cloneNode(true));
            return wrapper.innerHTML;
          }

          if (value === null) return "<pre>null</pre>";
          if (value === undefined) return "<pre>undefined</pre>";

          if (typeof value === "string") {
            return `<div class="text">${escapeHtml(value)}</div>`;
          }

          if (typeof value === "object") {
            try {
              return `<pre>${escapeHtml(
                JSON.stringify(value, null, 2, (_, v) =>
                  typeof v === "bigint" ? v.toString() + "n" : v,
                ),
              )}</pre>`;
            } catch {
              return `<pre>${escapeHtml(String(value))}</pre>`;
            }
          }

          return `<pre>${escapeHtml(String(value))}</pre>`;
        }

        function renderOutput(cell) {
          if (!cell.output.length) return "";

          return cell.output
            .map(
              (value) => `<div class="output-item">${renderValue(value)}</div>`,
            )
            .join("");
        }

        function languageFor(type) {
          return (
            {
              javascript: "javascript",
              typescript: "typescript",
              p5: "javascript",
              html: "xml",
              markdown: "markdown",
            }[type] || "javascript"
          );
        }

        function highlightCode(code, type) {
          const language = languageFor(type);
          const value = code || " ";

          try {
            return hljs.highlight(value, { language }).value;
          } catch {
            return escapeHtml(value);
          }
        }

        function closeContextMenu() {
          contextMenu.classList.remove("open");
          contextCellId = null;
        }

        function openContextMenu(event, cell) {
          event.preventDefault();
          event.stopPropagation();

          contextCellId = cell.id;

          contextMenu.querySelectorAll(".menu-item").forEach((item) => {
            item.classList.toggle("active", item.dataset.type === cell.type);
          });

          contextMenu.classList.add("open");

          const margin = 8;
          const rect = contextMenu.getBoundingClientRect();

          let x = event.clientX;
          let y = event.clientY;

          if (x + rect.width > window.innerWidth - margin) {
            x = window.innerWidth - rect.width - margin;
          }

          if (y + rect.height > window.innerHeight - margin) {
            y = window.innerHeight - rect.height - margin;
          }

          contextMenu.style.left = Math.max(margin, x) + "px";
          contextMenu.style.top = Math.max(margin, y) + "px";
        }

        contextMenu.addEventListener("click", (event) => {
          const item = event.target.closest(".menu-item");
          if (!item || !contextCellId) return;

          const cell = cells.find((c) => c.id === contextCellId);
          if (!cell) return;

          const oldType = cell.type;
          const newType = item.dataset.type;

          cell.type = newType;
          closeContextMenu();
          render();

          // Mantém a posição do cursor quando possível.
          if (cell.code.trim()) focusCell(cell.id);
        });

        document.addEventListener("mousedown", (event) => {
          if (!contextMenu.contains(event.target)) closeContextMenu();
        });

        window.addEventListener("scroll", closeContextMenu, true);
        window.addEventListener("resize", closeContextMenu);

        function render() {
          root.innerHTML = "";

          cells.forEach((cell, index) => {
            const last = isLastCell(cell);

            const article = document.createElement("article");
            article.className =
              "cell" +
              (last && cell.code.trim() === "" ? " empty-cell" : "") +
              (!last ? " code-cell" : "");

            article.dataset.id = cell.id;

            const gutter = document.createElement("div");
            gutter.className = "gutter";
            gutter.title =
              "Arraste para mover • botão direito para mudar o tipo";

            gutter.addEventListener("contextmenu", (event) => {
              openContextMenu(event, cell);
            });

            const content = document.createElement("div");
            content.className = "cell-content";

            const typeLabel = document.createElement("div");
            typeLabel.className = "cell-type";
            typeLabel.textContent =
              cell.type === "p5"
                ? "P5.js"
                : cell.type.charAt(0).toUpperCase() + cell.type.slice(1);

            const output = document.createElement("div");
            output.className = "output";
            output.innerHTML = renderOutput(cell);

            const codeEditor = document.createElement("div");
            codeEditor.className = "code-editor";

            const highlighted = document.createElement("pre");
            const codeElement = document.createElement("code");
            codeElement.className = "language-" + languageFor(cell.type);
            highlighted.appendChild(codeElement);

            const textarea = document.createElement("textarea");
            textarea.spellcheck = false;
            textarea.autocomplete = "off";
            textarea.setAttribute("aria-label", "Código");
            textarea.value = cell.code;

            function updateHighlight() {
              codeElement.innerHTML = highlightCode(textarea.value, cell.type);
              highlighted.scrollTop = textarea.scrollTop;
              highlighted.scrollLeft = textarea.scrollLeft;
              resizeTextarea(textarea);
              highlighted.style.height = textarea.style.height;
            }

            textarea.addEventListener("input", () => {
              cell.code = textarea.value;
              updateHighlight();

              if (isLastCell(cell) && cell.code.trim() !== "") {
                const selectionStart = textarea.selectionStart;
                const selectionEnd = textarea.selectionEnd;

                cells.push(createCell("", cell.type));
                render();

                requestAnimationFrame(() => {
                  const currentTextarea = document.querySelector(
                    `[data-id="${cell.id}"] textarea`,
                  );

                  if (currentTextarea) {
                    currentTextarea.focus();
                    currentTextarea.selectionStart = selectionStart;
                    currentTextarea.selectionEnd = selectionEnd;
                  }
                });
              }
            });

            textarea.addEventListener("scroll", () => {
              highlighted.scrollTop = textarea.scrollTop;
              highlighted.scrollLeft = textarea.scrollLeft;
            });

            textarea.addEventListener("keydown", (event) => {
              if (event.key === "Tab") {
                event.preventDefault();

                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                textarea.value =
                  textarea.value.slice(0, start) +
                  "  " +
                  textarea.value.slice(end);

                textarea.selectionStart = textarea.selectionEnd = start + 2;
                cell.code = textarea.value;
                updateHighlight();
              }

              if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
                event.preventDefault();
                executeFromCell(cell.id);
              }
            });

            codeEditor.append(highlighted, textarea);

            const tools = document.createElement("div");
            tools.className = "cell-tools";

            const run = document.createElement("button");
            run.className = "tool";
            run.title = "Executar";
            run.textContent = "▶";

            const remove = document.createElement("button");
            remove.className = "tool";
            remove.title = "Excluir célula";
            remove.textContent = "×";

            run.onclick = () => executeFromCell(cell.id);

            remove.onclick = () => {
              if (isLastCell(cell)) return;

              const i = cells.indexOf(cell);
              cells.splice(i, 1);
              ensureTrailingEmptyCell();
              render();
            };

            tools.append(run, remove);

            content.append(output, codeEditor, tools);
            article.append(gutter, content, typeLabel);
            root.appendChild(article);

            // Drag somente pelo gutter.
            gutter.addEventListener("mousedown", () => {
              article.draggable = true;
            });

            article.addEventListener("dragstart", (event) => {
              if (last) {
                event.preventDefault();
                article.draggable = false;
                return;
              }

              draggedId = cell.id;
              article.classList.add("dragging");
              event.dataTransfer.effectAllowed = "move";
              event.dataTransfer.setData("text/plain", cell.id);
            });

            article.addEventListener("dragend", () => {
              article.draggable = false;
              article.classList.remove("dragging");

              document
                .querySelectorAll(".drag-over")
                .forEach((el) => el.classList.remove("drag-over"));

              draggedId = null;
            });

            article.addEventListener("dragover", (event) => {
              if (!draggedId || draggedId === cell.id || last) return;

              event.preventDefault();
              event.dataTransfer.dropEffect = "move";
              article.classList.add("drag-over");
            });

            article.addEventListener("dragleave", () => {
              article.classList.remove("drag-over");
            });

            article.addEventListener("drop", (event) => {
              event.preventDefault();
              article.classList.remove("drag-over");

              if (!draggedId || draggedId === cell.id || last) return;

              const from = cells.findIndex((c) => c.id === draggedId);
              const to = cells.findIndex((c) => c.id === cell.id);

              if (from < 0 || to < 0) return;

              const [moved] = cells.splice(from, 1);
              const adjustedTo = from < to ? to - 1 : to;

              cells.splice(adjustedTo, 0, moved);

              render();
              focusCell(moved.id);
            });

            updateHighlight();
          });
        }

        function focusCell(id) {
          requestAnimationFrame(() => {
            const ta = document.querySelector(`[data-id="${id}"] textarea`);
            if (!ta) return;

            ta.focus();
            ta.selectionStart = ta.selectionEnd = ta.value.length;
            resizeTextarea(ta);
          });
        }

        /*
         * -------------------------
         * JavaScript / TypeScript
         * -------------------------
         */

        function extractDeclaredNames(code) {
          const names = new Set();

          const declarationRegex = /\b(?:let|const|var)\s+([^;]+)/g;
          let match;

          while ((match = declarationRegex.exec(code))) {
            let declaration = match[1];

            declaration = declaration.split(
              /\b(?:for|if|while|switch|catch)\b/,
            )[0];

            declaration = declaration.replace(
              /(["'`])(?:\\.|(?!\1)[\s\S])*\1/g,
              "",
            );

            const parts = [];
            let current = "";
            let depth = 0;

            for (const char of declaration) {
              if ("([{".includes(char)) depth++;
              if (")]}".includes(char)) depth--;

              if (char === "," && depth === 0) {
                parts.push(current);
                current = "";
              } else {
                current += char;
              }
            }

            parts.push(current);

            for (let part of parts) {
              part = part.split("=")[0].trim();

              if (/^[A-Za-z_$][\w$]*$/.test(part)) {
                names.add(part);
              }
            }
          }

          return [...names];
        }

        function transformDeclarations(code) {
          /*
           * A transformação mantém o modelo de notebook:
           *
           *   const x = 10
           *
           * vira:
           *
           *   __state.x = 10
           *
           * Isso torna o valor persistente entre células.
           */
          return code.replace(
            /\b(let|const|var)\s+([A-Za-z_$][\w$]*)/g,
            "__state.$2",
          );
        }

        /*
         * -------------------------
         * Markdown
         * -------------------------
         */

        function executeMarkdown(cell) {
          cell.output = [
            {
              __html: marked.parse(cell.code),
            },
          ];
        }

        /*
         * -------------------------
         * HTML
         * -------------------------
         */

        function executeHtml(cell) {
          cell.output = [
            {
              __html: cell.code,
            },
          ];
        }

        /*
         * -------------------------
         * P5.js
         * -------------------------
         *
         * Cada célula P5 possui um div exclusivo no output:
         *
         *   <div id="p5-cell-123"></div>
         *
         * O p5 é executado em modo de instância. Além disso, createCanvas()
         * é interceptado para que o canvas seja automaticamente anexado
         * ao div da própria célula.
         *
         * Assim o usuário pode escrever simplesmente:
         *
         *   function setup() {
         *     createCanvas(400, 300);
         *   }
         *
         * sem precisar escrever:
         *
         *   var myCanvas = ...
         *   myCanvas.parent(...)
         *
         * O notebook faz isso automaticamente.
         */

        function prepareP5Output(cell) {
          const id = "p5-output-" + cell.id;
          cell.output = [
            {
              __p5: true,
              id,
            },
          ];
        }

        function executeP5(cell) {
          prepareP5Output(cell);

          /*
           * P5 roda de maneira independente das células JS.
           * Ao reexecutar o notebook, o canvas anterior é removido.
           */
          requestAnimationFrame(() => {
            const host = document.getElementById("p5-output-" + cell.id);

            if (!host) return;

            try {
              new p5((p) => {
                /*
                 * createCanvas é encapsulado para que seu resultado seja
                 * automaticamente associado ao bloco da célula.
                 */
                const originalCreateCanvas = p.createCanvas.bind(p);

                p.createCanvas = (...args) => {
                  const canvas = originalCreateCanvas(...args);

                  try {
                    canvas.parent(host);
                  } catch {}

                  return canvas;
                };

                /*
                 * O código do usuário é convertido para funções de instância
                 * quando necessário. Para a API usual do p5:
                 *
                 *   function setup() {...}
                 *   function draw() {...}
                 *
                 * transformamos essas duas funções em p.setup/p.draw.
                 */
                let code = cell.code;

                code = code.replace(
                  /\bfunction\s+setup\s*\(/g,
                  "p.setup = function(",
                );

                code = code.replace(
                  /\bfunction\s+draw\s*\(/g,
                  "p.draw = function(",
                );

                /*
                 * Também suporta:
                 *
                 *   setup = () => {}
                 *   draw = () => {}
                 */
                code = code.replace(
                  /\bsetup\s*=\s*(?=(?:async\s*)?\()/g,
                  "p.setup = ",
                );

                code = code.replace(
                  /\bdraw\s*=\s*(?=(?:async\s*)?\()/g,
                  "p.draw = ",
                );

                const AsyncFunction = Object.getPrototypeOf(
                  async function () {},
                ).constructor;

                /*
                 * `with (p)` permite que createCanvas, ellipse, rect,
                 * background etc. continuem sendo escritos da forma habitual.
                 */
                const runner = new AsyncFunction(
                  "p",
                  `
              with (p) {
                ${code}
              }
            `,
                );

                runner(p);
              });
            } catch (error) {
              cell.output = [
                {
                  __error: error,
                },
              ];
              render();
            }
          });
        }

        /*
         * -------------------------
         * Renderização dos outputs
         * -------------------------
         */

        function renderOutput(cell) {
          if (!cell.output.length) return "";

          return cell.output
            .map((value) => {
              if (value && value.__html !== undefined) {
                return `<div class="output-item">${value.__html}</div>`;
              }

              if (value && value.__p5) {
                return `
          <div class="output-item">
            <div id="${escapeHtml(value.id)}"></div>
          </div>
        `;
              }

              if (value && value.__error) {
                const error = value.__error;
                return `
          <div class="output-item">
            <div class="error">${escapeHtml(error.stack || error.message || error)}</div>
          </div>
        `;
              }

              return `<div class="output-item">${renderValue(value)}</div>`;
            })
            .join("");
        }

        /*
         * O renderOutput acima é redefinido antes de cada renderização
         * porque os outputs especiais (HTML/P5) precisam ser interpretados
         * como elementos reais.
         */

        /*
         * -------------------------
         * Execução reativa
         * -------------------------
         */

        async function executeFromCell(targetId) {
          const targetIndex = cells.findIndex((c) => c.id === targetId);
          if (targetIndex < 0) return;

          // Guarda a célula que iniciou a execução.
          const target = cells[targetIndex];

          // Primeiro destrói outputs/canvases anteriores.
          cells.forEach((cell) => {
            cell.output = [];
          });

          const executableCells = cells.slice(0, cells.length - 1);

          /*
           * Estado compartilhado das células JavaScript.
           */
          const declaredNames = new Set();

          executableCells
            .filter(
              (cell) =>
                cell.type === "javascript" || cell.type === "typescript",
            )
            .forEach((cell) => {
              extractDeclaredNames(cell.code).forEach((name) =>
                declaredNames.add(name),
              );
            });

          const state = Object.create(null);

          declaredNames.forEach((name) => {
            state[name] = undefined;
          });

          const scope = new Proxy(state, {
            has(target, property) {
              if (property === Symbol.unscopables) return false;
              return property in target || property in globalThis;
            },

            get(target, property) {
              if (property === Symbol.unscopables) return undefined;
              if (property in target) return target[property];
              return globalThis[property];
            },

            set(target, property, value) {
              target[property] = value;
              return true;
            },

            getOwnPropertyDescriptor(target, property) {
              if (property in target) {
                return {
                  configurable: true,
                  enumerable: true,
                  writable: true,
                  value: target[property],
                };
              }
              return undefined;
            },
          });

          /*
           * Função que adiciona valores ao output da célula atualmente ativa.
           */
          function display(value) {
            const cell = cells.find((c) => c.id === activeCellId);
            if (cell) cell.output.push(value);
          }

          /*
           * Recalcula todas as células em sequência.
           */
          for (const cell of executableCells) {
            activeCellId = cell.id;

            if (!cell.code.trim()) continue;

            try {
              if (cell.type === "markdown") {
                executeMarkdown(cell);
                continue;
              }

              if (cell.type === "html") {
                executeHtml(cell);
                continue;
              }

              if (cell.type === "p5") {
                executeP5(cell);
                continue;
              }

              let source = cell.code;

              if (cell.type === "typescript") {
                source = ts.transpileModule(source, {
                  compilerOptions: {
                    target: ts.ScriptTarget.ES2020,
                    module: ts.ModuleKind.None,
                    strict: false,
                  },
                }).outputText;
              }

              source = transformDeclarations(source);

              /*
               * Cada célula JS/TS entra no mesmo estado compartilhado.
               */
              const AsyncFunction = Object.getPrototypeOf(
                async function () {},
              ).constructor;

              const runner = new AsyncFunction(
                "__state",
                "display",
                "__scope",
                `
            with (__scope) {
              ${source}
            }
          `,
              );

              await runner(state, display, scope);
            } catch (error) {
              cell.output.push({
                __error: error,
              });
            }
          }

          render();
          focusCell(target.id);
        }

        /*
         * O render precisa ser capaz de criar os hosts de P5 antes de o
         * requestAnimationFrame executá-lo.
         */
        function render() {
          root.innerHTML = "";

          cells.forEach((cell, index) => {
            const last = isLastCell(cell);

            const article = document.createElement("article");
            article.className =
              "cell" +
              (last && cell.code.trim() === "" ? " empty-cell" : "") +
              (!last ? " code-cell" : "");

            article.dataset.id = cell.id;

            const gutter = document.createElement("div");
            gutter.className = "gutter";
            gutter.title =
              "Arraste para mover • botão direito para mudar o tipo";

            gutter.addEventListener("contextmenu", (event) => {
              openContextMenu(event, cell);
            });

            const content = document.createElement("div");
            content.className = "cell-content";

            const typeLabel = document.createElement("div");
            typeLabel.className = "cell-type";
            typeLabel.textContent =
              cell.type === "p5"
                ? "P5.js"
                : cell.type.charAt(0).toUpperCase() + cell.type.slice(1);

            const output = document.createElement("div");
            output.className = "output";
            output.innerHTML = renderOutput(cell);

            const codeEditor = document.createElement("div");
            codeEditor.className = "code-editor";

            const highlighted = document.createElement("pre");
            const codeElement = document.createElement("code");

            codeElement.className = "language-" + languageFor(cell.type);

            highlighted.appendChild(codeElement);

            const textarea = document.createElement("textarea");
            textarea.spellcheck = false;
            textarea.autocomplete = "off";
            textarea.setAttribute("aria-label", "Código");
            textarea.value = cell.code;

            function updateHighlight() {
              codeElement.innerHTML = highlightCode(textarea.value, cell.type);

              highlighted.scrollTop = textarea.scrollTop;
              highlighted.scrollLeft = textarea.scrollLeft;

              resizeTextarea(textarea);
              highlighted.style.height = textarea.style.height;
            }

            textarea.addEventListener("input", () => {
              cell.code = textarea.value;
              updateHighlight();

              if (isLastCell(cell) && cell.code.trim() !== "") {
                const selectionStart = textarea.selectionStart;
                const selectionEnd = textarea.selectionEnd;

                cells.push(createCell("", cell.type));
                render();

                requestAnimationFrame(() => {
                  const currentTextarea = document.querySelector(
                    `[data-id="${cell.id}"] textarea`,
                  );

                  if (currentTextarea) {
                    currentTextarea.focus();
                    currentTextarea.selectionStart = selectionStart;
                    currentTextarea.selectionEnd = selectionEnd;
                  }
                });
              }
            });

            textarea.addEventListener("scroll", () => {
              highlighted.scrollTop = textarea.scrollTop;
              highlighted.scrollLeft = textarea.scrollLeft;
            });

            textarea.addEventListener("keydown", (event) => {
              if (event.key === "Tab") {
                event.preventDefault();

                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;

                textarea.value =
                  textarea.value.slice(0, start) +
                  "  " +
                  textarea.value.slice(end);

                textarea.selectionStart = textarea.selectionEnd = start + 2;

                cell.code = textarea.value;
                updateHighlight();
              }

              if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
                event.preventDefault();
                executeFromCell(cell.id);
              }
            });

            codeEditor.append(highlighted, textarea);

            const tools = document.createElement("div");
            tools.className = "cell-tools";

            const run = document.createElement("button");
            run.className = "tool";
            run.title = "Executar";
            run.textContent = "▶";

            const remove = document.createElement("button");
            remove.className = "tool";
            remove.title = "Excluir célula";
            remove.textContent = "×";

            run.onclick = () => executeFromCell(cell.id);

            remove.onclick = () => {
              if (isLastCell(cell)) return;

              const i = cells.indexOf(cell);
              cells.splice(i, 1);

              ensureTrailingEmptyCell();
              render();
            };

            tools.append(run, remove);

            content.append(output, codeEditor, tools);
            article.append(gutter, content, typeLabel);
            root.appendChild(article);

            gutter.addEventListener("mousedown", () => {
              article.draggable = true;
            });

            article.addEventListener("dragstart", (event) => {
              if (last) {
                event.preventDefault();
                article.draggable = false;
                return;
              }

              draggedId = cell.id;
              article.classList.add("dragging");

              event.dataTransfer.effectAllowed = "move";
              event.dataTransfer.setData("text/plain", cell.id);
            });

            article.addEventListener("dragend", () => {
              article.draggable = false;
              article.classList.remove("dragging");

              document
                .querySelectorAll(".drag-over")
                .forEach((el) => el.classList.remove("drag-over"));

              draggedId = null;
            });

            article.addEventListener("dragover", (event) => {
              if (!draggedId || draggedId === cell.id || last) return;

              event.preventDefault();
              event.dataTransfer.dropEffect = "move";
              article.classList.add("drag-over");
            });

            article.addEventListener("dragleave", () => {
              article.classList.remove("drag-over");
            });

            article.addEventListener("drop", (event) => {
              event.preventDefault();
              article.classList.remove("drag-over");

              if (!draggedId || draggedId === cell.id || last) return;

              const from = cells.findIndex((c) => c.id === draggedId);
              const to = cells.findIndex((c) => c.id === cell.id);

              if (from < 0 || to < 0) return;

              const [moved] = cells.splice(from, 1);
              const adjustedTo = from < to ? to - 1 : to;

              cells.splice(adjustedTo, 0, moved);

              render();
              focusCell(moved.id);
            });

            updateHighlight();
          });
        }

        /*
         * Primeiro desenho.
         */
        render();
      })();
    </script>
  </body>
</html>
