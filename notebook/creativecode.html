<link id="highlight-theme-export" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/github.min.css">
<script>
(function(){
const CDN="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/";
const aliases={
  "light":"github","github":"github","github dark":"github-dark","github-dark":"github-dark",
  "dracula":"dracula","nord":"nord","monokai":"monokai","one dark":"atom-one-dark","one-dark":"atom-one-dark",
  "solarized dark":"solarized-dark","solarized-dark":"solarized-dark",
  "solarized light":"solarized-light","solarized-light":"solarized-light",
  "gruvbox dark":"base16/gruvbox-dark-medium","gruvbox-dark":"base16/gruvbox-dark-medium",
  "gruvbox light":"base16/gruvbox-light-medium","gruvbox-light":"base16/gruvbox-light-medium"
};
function norm(v){return String(v||"").trim().replace(/.css$/i,"").replace(/s+/g," ").toLowerCase()}
function resolve(v){
  if(!v||norm(v)==="auto")return matchMedia("(prefers-color-scheme:dark)").matches?"github-dark":"github";
  return aliases[norm(v)]||String(v).trim().replace(/^styles//i,"").replace(/.css$/i,"").replace(/^/+|/+$/g,"");
}
function rgb(v){
  const m=String(v||"").match(/^rgba?(([d.]+),s*([d.]+),s*([d.]+)/);return m?{r:+m[1],g:+m[2],b:+m[3]}:null
}
function hex(v){const c=n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,"0");return"#"+c(v.r)+c(v.g)+c(v.b)}
function mix(a,b,p){const x=rgb(a),y=rgb(b);return x&&y?hex({r:x.r+(y.r-x.r)*p,g:x.g+(y.g-x.g)*p,b:x.b+(y.b-x.b)*p}):a}
function sync(){
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-10000px;top:-10000px;opacity:0";
  host.innerHTML='<pre class="hljs"><code class="hljs"><span class="hljs-comment">c</span><span class="hljs-keyword">k</span><span class="hljs-string">s</span><span class="hljs-deletion">d</span></code></pre>';
  document.body.appendChild(host);
  const q=s=>host.querySelector(s);
  const c=e=>e?getComputedStyle(e).color:null;
  const bg=getComputedStyle(q("code")).backgroundColor;
  const fg=c(q("code"))||"rgb(36,36,36)";
  const b=rgb(bg)||{r:255,g:255,b:255}, f=rgb(fg)||{r:36,g:36,b:36};
  const bhex=hex(b), fhex=hex(f);
  const muted=c(q(".hljs-comment"))||fg, accent=c(q(".hljs-keyword"))||fg, error=c(q(".hljs-deletion"))||fg;
  document.documentElement.style.setProperty("--bg",bhex);
  document.documentElement.style.setProperty("--fg",fhex);
  document.documentElement.style.setProperty("--code",bhex);
  document.documentElement.style.setProperty("--muted",rgb(muted)?hex(rgb(muted)):mix(fhex,bhex,.55));
  document.documentElement.style.setProperty("--line",mix(fhex,bhex,.16));
  document.documentElement.style.setProperty("--hover",mix(fhex,bhex,.07));
  document.documentElement.style.setProperty("--accent",rgb(accent)?hex(rgb(accent)):fhex);
  document.documentElement.style.setProperty("--error",rgb(error)?hex(rgb(error)):"#b42318");
  document.body.removeChild(host);
}
const link=document.getElementById("highlight-theme-export");
const theme=new URLSearchParams(location.search).get("temptheme")||"auto";
link.href=CDN+resolve(theme)+".min.css";
link.addEventListener("load",sync,{once:true});
document.addEventListener("DOMContentLoaded",sync,{once:true});
})();
</script>

<script type="text/markdown" data-notebook-cell data-cell-id="cell-13" data-cell-type="markdown">Em outras palavras:

Você poderá executar códigos diferentes, suas variações, e seus experimentos, em um mesmo lugar, e poderá deixar anotações e explicações sobre cada um deles, utilizando linguagens de marcação `HTML` e/ou `Markdown`.

Esta ferramenta foi desenvolvida para que possa ser utilizada prioritamente com linguagens `javascript` e `P5` (que na verdade é também `javascript`). Mas além destas duas, o notebook também trabalha com `typescript`, `HTML`, `CSS` e `Markdown`.

Como em todos os notebooks computacionais (à exemplo do Jupyter, Colab ou Observable), as informações apresentadas são construídas em blocos de código que ficam logo embaixo dos conteúdos. Estes blocos podem ser ocultados ou exibidos, mas tudo que é mostrado no notebook é construído dentro destes blocos de código, até os textos (que são feitos com `HTML` ou `Markdown`).

Você pode mover os códigos e conteúdos para cima e para baixo no documento, lhes arrastando à partir do ícone que aparece no lado esquerdo de cada bloco quando se passa o mouse por cima dele. É através deste ícone também que se altera o tipo de código utilizado em cada bloco, clicando nele com o botão direito do mouse.

Tudo que você faz neste documento fica guardado no navegador, para que quando retorne a ele, seu trabalho continue lá. Mas isso só funciona se utilizar o mesmo navegador, no mesmo computador, e no mesmo endereço da URL.

Para guardar seus códigos em um documento separado e poder levá-lo para outros lugares, utilize **CTRL+S**. Isso gerará um código `HTML` que poderá ser novamente carregado em outros lugares utilizando **CTRL+I**.

Se você utilizar **CTRL+SHIFT+S**, a ferramenta irá se auto-exportar com seu código, isto é: ela gerará um documento `HTML` contendo a ferramenta integral já com seu código, permitindo que você tenha o editor/ambiente completo de execução junto aos seus códigos em um único arquivo. 


</script>

<script>
(() => {
  "use strict";

  const root = document.querySelector("#notebook");
  const state = Object.create(null);
  const scope = new Proxy(state, {
    has(target, property){
      if(property === Symbol.unscopables) return false;
      return property in target || property in globalThis;
    },
    get(target, property){
      if(property === Symbol.unscopables) return undefined;
      return property in target ? target[property] : globalThis[property];
    },
    set(target, property, value){target[property] = value; return true;}
  });

  // No documento exportado, display() deliberadamente usa o console.
  window.display = value => console.log(value);

  function transformDeclarations(code){
    return code.replace(/\b(let|const|var)\s+([A-Za-z_$][\w$]*)/g, "__state.$2");
  }

  function extractNames(code){
    const names = new Set();
    const re = /\b(?:let|const|var)\s+([^;]+)/g;
    let m;
    while((m = re.exec(code))){
      const first = m[1].split(/\b(?:for|if|while|switch|catch)\b/)[0];
      first.split(",").forEach(part => {
        const name = part.split("=")[0].trim();
        if(/^[A-Za-z_$][\w$]*$/.test(name)) names.add(name);
      });
    }
    return [...names];
  }

  const nodes = [...document.querySelectorAll("[data-notebook-cell]")];
  const cells = nodes.map((node, index) => {
    const comment = (() => {
      let n = node.previousSibling;
      while(n && n.nodeType !== Node.COMMENT) n = n.previousSibling;
      return n ? n.data : "";
    })();
    const type = (comment.match(/type:s*([^
]+)/i) || [, node.dataset.cellType || "javascript"])[1].trim();
    const hidden = ((comment.match(/hidden:s*(true|false)/i) || [,"false"])[1] === "true");
    return {node, type, hidden, index};
  });

  cells.forEach(cell => {
    if(cell.type === "javascript" || cell.type === "typescript") {
      const code = cell.node.textContent;
      extractNames(cell.type === "typescript" && window.ts ? ts.transpileModule(code, {compilerOptions:{target:ts.ScriptTarget.ES2020,module:ts.ModuleKind.None,strict:false}}).outputText : code)
        .forEach(name => state[name] = undefined);
    }
  });

  function makeCellShell(cell, codeText){
    const section = document.createElement("section");
    section.className = "cell";
    const header = document.createElement("div");
    header.className = "cell-header";
    header.textContent = String(cell.index + 1).padStart(2,"0") + " · " + cell.type + (cell.hidden ? " · escondido" : "");
    const code = document.createElement("pre");
    code.className = "cell-code" + (cell.hidden ? " hidden" : "");
    code.textContent = codeText;
    const output = document.createElement("div");
    output.className = "output";
    section.append(header, code, output);
    root.appendChild(section);
    return output;
  }

  async function runCell(cell){
    const codeText = cell.node.textContent;
    const output = makeCellShell(cell, codeText);
    if(!codeText.trim()) return;

    try {
      if(cell.type === "markdown"){
        output.innerHTML = marked.parse(codeText);
        return;
      }

      if(cell.type === "html"){
        output.appendChild(cell.node.content.cloneNode(true));
        return;
      }

      if(cell.type === "css"){
        const style = document.createElement("style");
        style.textContent = codeText;
        output.appendChild(style);
        return;
      }

      if(cell.type === "p5"){
        const host = document.createElement("div");
        host.className = "p5-host";
        output.appendChild(host);
        new p5(p => {
          const originalCreateCanvas = p.createCanvas.bind(p);
          p.createCanvas = (...args) => {
            const canvas = originalCreateCanvas(...args);
            try { canvas.parent(host); } catch {}
            return canvas;
          };
          const source = codeText
            .replace(/\bwindowWidth\b/g, String(Math.max(1, host.clientWidth || root.clientWidth || 1)))
            .replace(/\bwindowHeight\b/g, "550");
          const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
          const runner = new AsyncFunction("p", "with (p) { " + source + " }");
          runner(p);
        });
        return;
      }

      let source = codeText;
      if(cell.type === "typescript"){
        source = ts.transpileModule(source, {
          compilerOptions:{target:ts.ScriptTarget.ES2020,module:ts.ModuleKind.None,strict:false}
        }).outputText;
      }
      source = transformDeclarations(source);
      const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
      const runner = new AsyncFunction("__state","display","__scope", "with (__scope) { " + source + " }");
      await runner(state, window.display, scope);
    } catch(error){
      const div = document.createElement("div");
      div.className = "error";
      div.textContent = error.stack || error.message || String(error);
      output.appendChild(div);
      console.error(error);
    }
  }

  (async () => {
    for(const cell of cells) await runCell(cell);
  })();
})();
</script>
